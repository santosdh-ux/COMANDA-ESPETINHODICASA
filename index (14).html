<script>
const CFG={apiKey:"AIzaSyA0JWR3EyD6WnPLkycruhW9k0f6_kL8HK8",authDomain:"espetinho-pedidos-jp.firebaseapp.com",projectId:"espetinho-pedidos-jp",storageBucket:"espetinho-pedidos-jp.firebasestorage.app",messagingSenderId:"825804185421",appId:"1:825804185421:web:f6c901305b62abab232104"};
firebase.initializeApp(CFG);
const auth=firebase.auth(),db=firebase.firestore(),DOM="@espetinhos.app";
db.settings({experimentalForceLongPolling:true});
setTimeout(()=>$("#splash").classList.add("off"),8000);
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),money=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const S={cfg:{nome:"Espetinhos",cor:"#ff6a1a",logo:""},mesas:[],prods:[],peds:[],users:[],tab:"",mesa:null,cat:null,draft:{},u:null,un:[],prev:null};
const TABS={garcom:[["mesas","Mesas"],["meus","Meus pedidos"]],cozinha:[["fila","Fila"],["painel","Painel"]],churrasqueiro:[["fila","Fila"],["painel","Painel"]],admin:[["peds","Pedidos"],["rel","Relatórios"],["equipe","Equipe"],["mesasadm","Mesas"],["prodadm","Produtos"],["cfg","Config"]]};
const IC={mesas:"🍽️",meus:"🧾",fila:"🔥",painel:"📊",peds:"📋",rel:"📈",equipe:"👥",mesasadm:"🪑",prodadm:"🍢",cfg:"⚙️"};
const LBL={novo:"Enviado",preparo:"Em preparo",pronto:"Pronto",entregue:"Entregue"};
const SEED="Espetinhos*1|Calabresa:6,Frango:6,Porco:6,Salsichão:6,Asinha de frango:9,Alcatra:10,Carne de sol:10,Carne de sol com queijo:10,Charque:10,Coração:10,Cupim:10,Frango com bacon:10,Kafta:10,Linguiça calabresa:8,Linguiça toscana:8,Medalhão de frango:10,Medalhão recheado:10,Queijo coalho:10,Ovo com bacon:9;Pão de alho*1|Bacon:9,Camarão:10,Carne seca com cream cheese:15,Calabresa:9,Tradicional:8;Pra beliscar*1|Batata frita P:10,Batata frita G:15,Camarão empanado 300gr:40,Camarão alho e óleo 300ml:35,Carne de sol com fritas:40,Calabresa com fritas:25,Ensopado de camarão 300ml:25,Ensopado de marisco 300ml:25,Fava porção 300gr:20,Isca de frango:25,Mocotó porção 300ml:20,Purê de macaxeira 300gr:20,Tripá bovina:20,Pra beliscar completo:55;Pastéis*1|Carne seca com cream cheese:25,Frango:20,Frango com cream cheese:25,Queijo:20;Caldinhos*1|Caldinho de camarão:10,Caldinho de charque:10,Caldinho de fava:8,Caldinho de mocotó:10;Dindin gourmet*1|Surpresa de morango:6,Mousse de maracujá:6,Oreo:6,Pudim:6,Ninho com morango:6;Cervejas 600ml*0|Itaipava:8,Skol Pilsen:9,Amstel:10,Brahma Chopp:10;Sucos*0|Jarra acerola:20,Caju:10,Cajá:10,Graviola:10,Manga:10,Maracujá:12,Jarra maracujá:24;Cachaças 300ml*0|Matuta cristal:20,Matuta sabor:22,Serra da Areia cristal:20,Serra da Areia sabor:22;Doses*0|Dreher:5,Red Label:10,Montila:5,Matuta cristal:4,Matuta sabor:5,Serra da Areia cristal:4,Serra da Areia sabor:5";
let tt,ac;
const toast=m=>{const t=$("#toast");t.textContent=m;t.className="show";clearTimeout(tt);tt=setTimeout(()=>t.className="",3000)};
const AC=window.AudioContext||window.webkitAudioContext;
/* celular só libera o som depois de um toque: "destravamos" o áudio em qualquer toque na tela (e de novo se ele voltar a dormir) */
const destravar=()=>{try{ac=ac||new AC();if(ac.state!=="running")ac.resume();const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0)}catch(e){}};
["pointerdown","touchend","click","keydown"].forEach(ev=>addEventListener(ev,destravar,{passive:true}));
const tocar=()=>{const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type="square";o.frequency.value=880;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.7,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.3);
 o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.32)};
const beep=()=>{try{ac=ac||new AC();ac.state==="running"?tocar():ac.resume().then(tocar).catch(()=>{});navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}};
const logo=()=>S.cfg.logo?`<img src="${S.cfg.logo}" alt="">`:"🔥",ago=p=>Math.floor((Date.now()-p.ts)/60000),tot=ps=>ps.reduce((s,p)=>s+p.itens.reduce((a,i)=>a+i.preco*i.qty,0),0);
function theme(){document.documentElement.style.setProperty("--acc",S.cfg.cor);document.title=S.cfg.nome;$("#sl").innerHTML=logo();$("#sn").textContent=S.cfg.nome}

auth.onAuthStateChanged(async f=>{S.un.forEach(u=>u());S.un=[];S.prev=null;
 if(!f){S.u=null;$("#splash").classList.add("off");return render()}
 try{const d=await db.collection("users").doc(f.uid).get();if(!d.exists||d.data().ativo===false)throw 0;
  S.u={uid:f.uid,...d.data()};S.tab=TABS[S.u.role][0][0];start()}
 catch(e){await auth.signOut();toast(e&&e.code&&e.code!=="permission-denied"?"Sem conexão com o servidor ("+e.code+")":"Acesso não autorizado: usuário sem cadastro ou inativo.")}
 $("#splash").classList.add("off")});
function start(){const sub=(q,fn)=>S.un.push(q.onSnapshot(fn,e=>console.error(e.code))),list=s=>s.docs.map(d=>({id:d.id,...d.data()}));
 sub(db.collection("config").doc("app"),d=>{if(d.exists)Object.assign(S.cfg,d.data());theme();render()});
 sub(db.collection("mesas"),s=>{S.mesas=list(s).sort((a,b)=>a.ord-b.ord);render()});
 sub(db.collection("produtos"),s=>{S.prods=list(s).sort((a,b)=>a.nome.localeCompare(b.nome));render()});
 sub(db.collection("pedidos").where("aberto","==",true),s=>{const n=list(s).sort((a,b)=>a.ts-b.ts);
  if(S.prev)n.forEach(p=>{const o=S.prev[p.id];
   if(S.u.role==="garcom"&&p.garcomUid===S.u.uid&&o){const nv=(p.prontos||[]).filter(k=>!o.k.includes(k)&&p.itens[k]);
    if(nv.length){toast("✅ "+p.mesaNome+": "+nv.map(k=>p.itens[k].nome).join(", ")+(nv.length>1?" prontos!":" pronto!"));beep()}
    else if(p.status==="pronto"&&o.s!=="pronto"){toast("✅ "+p.mesaNome+": pedido pronto!");beep()}}
   if(["cozinha","churrasqueiro"].includes(S.u.role)&&o===undefined&&p.status==="novo"&&pendEst(p,estacao())>0){toast("🔔 Novo pedido: "+p.mesaNome);beep()}});
  S.prev=Object.fromEntries(n.map(p=>[p.id,{s:p.status,k:p.prontos||[]}]));S.peds=n;render()});
 if(S.u.role==="admin")sub(db.collection("users"),s=>{S.users=list(s);render()});
 if(S.u.role==="garcom"){S.chm=undefined;S.chmN=0;
  sub(db.collection("chamadas").doc("cozinha"),d=>{const c=d.exists?d.data():null;
   if(S.chm===undefined){S.chm=c?c.ts:0;return}   /* primeira leitura = só marca o ponto de partida, não avisa */
   if(c&&c.ts!==S.chm){S.chm=c.ts;alertaCozinha(c)}})}}

function login(){return `<div class="login"><div class="card"><div class="mark">${logo()}</div><h2 style="margin-top:14px">${esc(S.cfg.nome)}</h2><p class="m">Acesso restrito à equipe</p><form onsubmit="return entrar(event)"><label>Usuário</label><input id="lu" autocapitalize="none" autocomplete="username" required><label>Senha</label><input id="lp" type="password" autocomplete="current-password" required><button class="pri" style="width:100%;margin-top:16px">Entrar</button><div class="err" id="le"></div></form></div></div>`}
function entrar(e){e.preventDefault();auth.signInWithEmailAndPassword($("#lu").value.trim().toLowerCase()+DOM,$("#lp").value).catch(()=>$("#le").textContent="Usuário ou senha incorretos.");return false}
const typing=()=>{const e=document.activeElement;return e&&e.closest&&e.closest("#app")&&/INPUT|TEXTAREA|SELECT/.test(e.tagName)};
function render(){if(typing())return;const a=$("#app");if(!S.u){if(!a.querySelector(".login"))a.innerHTML=login();return}
 a.innerHTML=`<header><span class="mark">${logo()}</span><b>${esc(S.cfg.nome)}</b><span class="sp"></span>${!["cozinha","churrasqueiro"].includes(S.u.role)?'<button onclick="abrirUltima()" aria-label="Última comanda">🧾</button>':""}<button onclick="senha()" aria-label="Alterar minha senha">🔑</button><button onclick="auth.signOut()">${esc(S.u.nome)} · Sair</button></header><nav>${TABS[S.u.role].map(([k,n])=>`<button class="${S.tab===k?"pri":""}" onclick="S.tab='${k}';render()"><i>${IC[k]||"•"}</i><span>${n}</span></button>`).join("")}</nav><main>${({mesas:vMesas,meus:vMeus,fila:vFila,painel:vPainel,peds:vPeds,rel:vRel,equipe:vEquipe,mesasadm:vMesasAdm,prodadm:vProdAdm,cfg:vCfg}[S.tab]||(()=>""))()}</main>`}
addEventListener("focusout",()=>setTimeout(render,250));setInterval(render,30000);
function senha(){pedirTexto("Nova senha (mínimo 6 caracteres)","",p=>{if(p.length<6)return toast("A senha precisa ter 6+ caracteres");auth.currentUser.updatePassword(p).then(()=>toast("Senha alterada")).catch(e=>toast(e.code==="auth/requires-recent-login"?"Saia e entre de novo para trocar a senha":"Erro: "+e.code))},"password")}

const cardPed=(p,act)=>`<div class="ln" style="align-items:flex-start"><div style="flex:1"><b>${esc(p.mesaNome)}</b> <span class="m">· ${esc(p.garcomNome)} · ${ago(p)} min</span>${p.itens.map((i,k)=>`<div>${(p.prontos||[]).includes(k)?"✅ ":""}${i.qty}× ${esc(i.nome)}${i.obs?` <small class="m">(${esc(i.obs)})</small>`:""}</div>`).join("")}</div><div><span class="tag ${p.status}">${LBL[p.status]}</span>${parcial(p)}${act&&p.status==="pronto"?`<br><button class="ok" onclick="setSt('${p.id}','entregue')">Entregar</button>`:""}</div></div>`;
function vMesas(){const ms=S.mesas.filter(m=>m.ativa!==false);
 const chips=`<div class="mg">${ms.map(m=>{const l=S.peds.filter(p=>p.mesaId===m.id),r=l.some(temPronto);return `<button class="mc${S.mesa===m.id?" on":""}${r?" rdy":l.length?" occ":""}" onclick="S.mesa='${m.id}';render()"><b>${esc(m.nome)}</b><small>${r?"✅ Pronto!":l.length?money(tot(l)):"Livre"}</small></button>`}).join("")}${ms.length?"":'<span class="m">Nenhuma mesa ainda.</span>'}<button class="mc add" onclick="novaMesa()"><b>＋</b><small>Nova mesa</small></button></div>`;

/* ===== COMANDA: impressão (RawBT) + comanda virtual ===== */
const PAPEL=32;          // colunas por linha: 32 = bobina 58mm | 48 = bobina 80mm
const SEM_ACENTO=true;   // true evita letras estranhas em impressoras que não entendem acento
const sa=s=>SEM_ACENTO?String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,""):String(s);
const brl=n=>money(n).replace(/\u00a0/g," ");

function montarComanda(m,ps){
 const mapa=new Map();
 ps.forEach(p=>p.itens.forEach(i=>{const k=i.nome+"|"+(i.obs||"")+"|"+i.preco,x=mapa.get(k);
  x?x.qty+=i.qty:mapa.set(k,{nome:i.nome,obs:i.obs||"",preco:i.preco,qty:i.qty})}));
 const itens=[...mapa.values()];
 return{mesa:m.nome,garcom:S.u.nome,loja:S.cfg.nome,ts:Date.now(),itens,total:itens.reduce((s,i)=>s+i.preco*i.qty,0)}}

/* devolve a lista de linhas [{s:texto, b:negrito}] — a mesma lista vai pra tela e pra impressora */
function linhasComanda(c){
 const L=PAPEL,tr="-".repeat(L),
  lin=(a,b)=>a.slice(0,Math.max(0,L-b.length-1)).padEnd(L-b.length)+b,
  ctr=s=>" ".repeat(Math.max(0,Math.floor((L-s.length)/2)))+s,
  wrap=(s,w)=>{const o=[];while(s.length>w){let k=s.lastIndexOf(" ",w);if(k<1)k=w;o.push(s.slice(0,k));s=s.slice(k).trimStart()}o.push(s);return o},
  d=new Date(c.ts),dh=d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),
  r=[],add=(s,b)=>r.push({s,b:!!b});
 add(ctr(sa(c.loja)),1);add(ctr("COMANDA"));add(tr);
 add(sa("Mesa: "+c.mesa),1);add(sa("Garcom: "+c.garcom));add(dh);add(tr);
 c.itens.forEach(i=>{
  const w=wrap(sa(i.qty+"x "+i.nome),L),v=brl(i.preco*i.qty),u=w.pop();
  w.forEach(x=>add(x));
  if(u.length+v.length<L)add(lin(u,v));else{add(u);add(lin("",v))}
  if(i.obs)wrap("("+sa(i.obs)+")",L-2).forEach(x=>add("  "+x))});
 add(tr);add(lin("TOTAL",brl(c.total)),1);add(tr);add(ctr("Obrigado!"));add(ctr("Sem valor fiscal"));
 return r}

function bytesComanda(c){
 const E=new TextEncoder(),p=[],raw=(...b)=>p.push(Uint8Array.from(b));
 raw(0x1b,0x40);                                   // iniciar impressora
 linhasComanda(c).forEach(({s,b})=>{raw(0x1b,0x45,b?1:0);p.push(E.encode(s+"\n"))}); // negrito + texto
 raw(0x1b,0x45,0);raw(0x1b,0x64,4);                // desliga negrito e avança 4 linhas
 const u=new Uint8Array(p.reduce((a,x)=>a+x.length,0));let o=0;p.forEach(x=>{u.set(x,o);o+=x.length});return u}

function b64(u){let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}

function imprimir(c){

const VIRADA=5; // o "dia de vendas" só vira às 5h da manhã: venda feita à 1h conta no dia anterior
const PERS=[["hoje","Hoje"],["7d","7 dias"],["30d","30 dias"],["mes","Este mês"]];

const p2=n=>String(n).padStart(2,"0"),
 baseDia=()=>{const d=new Date(Date.now()-VIRADA*36e5);return[d.getFullYear(),d.getMonth(),d.getDate()]},
 iniPer=p=>{const[y,m,d]=baseDia();return Math.max(S.cfg.relDesde||0,new Date(y,m,p==="hoje"?d:p==="7d"?d-6:p==="30d"?d-29:1,VIRADA).getTime())},
 dk=ts=>{const d=new Date(ts-VIRADA*36e5);return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())},

async function carregarRel(){

function agregar(peds,ini,per){
 const dias=new Map(),horas=Array(24).fill(0),prods=new Map(),garc=new Map(),contas=new Set();let total=0,itens=0;
 peds.forEach(p=>{const its=p.itens||[],v=its.reduce((a,i)=>a+i.preco*i.qty,0),f=p.fechadoEm;total+=v;
  dias.set(dk(f),(dias.get(dk(f))||0)+v);
  horas[(new Date(f).getHours()-VIRADA+24)%24]+=v;
  const g=p.garcomNome||"?";garc.set(g,(garc.get(g)||0)+v);
  contas.add(p.mesaId+"|"+Math.floor(f/2000));
  its.forEach(i=>{const k=i.nome+"|"+i.preco,x=prods.get(k)||{nome:i.nome,preco:i.preco,qty:0,valor:0};
   x.qty+=i.qty;x.valor+=i.preco*i.qty;itens+=i.qty;prods.set(k,x)})});
 /* série por dia: preenche também os dias sem venda */
 const serie=[],cur=new Date(ini),hoje=dk(Date.now());
 for(let n=0;n<400;n++){const k=dk(cur.getTime()),sd=new Date(cur.getTime()-VIRADA*36e5);
  serie.push({k,v:dias.get(k)||0,l:per==="7d"?SEM[sd.getDay()]+" "+sd.getDate():String(sd.getDate()),
   full:sd.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit"})});
  if(k>=hoje)break;cur.setDate(cur.getDate()+1)}
 /* série por hora (usada no "Hoje"): corta as horas vazias das pontas */
 let h=horas.map((v,k)=>({v,l:((VIRADA+k)%24)+"h",full:((VIRADA+k)%24)+"h"}));
 const a=h.findIndex(x=>x.v>0),z=h.length-1-[...h].reverse().findIndex(x=>x.v>0);
 h=a<0?[]:h.slice(a,z+1);
 const nomes={};[...prods.values()].forEach(x=>{(nomes[x.nome]=nomes[x.nome]||new Set()).add(x.preco)});
 const top=[...prods.values()].sort((x,y)=>y.qty-x.qty||y.valor-x.valor).slice(0,10)
  .map(x=>({...x,n:nomes[x.nome].size>1?x.nome+" ("+brl(x.preco)+")":x.nome}));
 return{total,itens,contas:contas.size,serie,horas:h,top,garc:[...garc].map(([n,v])=>({n,v})).sort((x,y)=>y.v-x.v)}}

const colunas=it=>{const mx=Math.max(1,...it.map(x=>x.v)),n=it.length,H=130,step=n>14?Math.ceil(n/8):1;
 return `<div class="cols">${it.map((x,k)=>`<div class="col"><span class="v">${n<=10&&x.v?curto(x.v):""}</span><i class="b${x.v?"":" z"}" style="height:${x.v?Math.max(3,Math.round(x.v/mx*H)):2}px"></i><span class="l">${k%step===0?esc(x.l):""}</span></div>`).join("")}</div>`};
const hbar=(rows,fmt)=>{const mx=Math.max(1,...rows.map(r=>r.v));
 return rows.map(r=>`<div><div class="hl"><span>${esc(r.n)}</span><b>${fmt(r)}</b></div><div class="ht"><i style="width:${Math.round(r.v/mx*100)}%"></i></div></div>`).join("")};

function zerarRel(){
 confirmar("Zerar os relatórios?","As vendas feitas até agora deixam de aparecer nos números e gráficos. Nada é apagado do sistema, e dá pra voltar a contar tudo depois.",()=>defDesde(Date.now()),1)}
function voltarRel(){confirmar("Voltar a contar tudo?","Todas as vendas, inclusive as de teste, voltam a aparecer nos relatórios.",()=>defDesde(0))}
function defDesde(t){db.collection("config").doc("app").set({relDesde:t},{merge:true})
 .then(()=>{S.cfg.relDesde=t;S.rel.dados={};S.rel.erro="";render();toast(t?"Relatórios zerados":"Contando todas as vendas")})
 .catch(e=>toast("Erro: "+e.code))}
function vRel(){
 const R=S.rel,d=R.dados[R.per];
 if(!R.carregando&&!R.erro&&(!d||Date.now()-d.quando>18e4))carregarRel();
 const chips=`<div class="chips">${PERS.map(([k,n])=>`<button class="${R.per===k?"pri":""}" onclick="S.rel.per='${k}';S.rel.erro='';render()">${n}</button>`).join("")}<button onclick="relRef()">🔄 Atualizar</button></div>`;
 if(R.erro)return chips+`<div class="card"><p>Não foi possível carregar os relatórios (${esc(R.erro)}).</p><button class="pri" onclick="relRef()">Tentar de novo</button></div>`;
 if(!d)return chips+'<div class="card"><p class="m">Carregando…</p></div>';
 const A=agregar(d.peds,d.ini,R.per),hora=new Date(d.quando),
  info=`<p class="m" style="margin:0 0 10px">Atualizado às ${p2(hora.getHours())}:${p2(hora.getMinutes())}${R.carregando?" · atualizando…":""} · o dia de vendas vira às ${VIRADA}h</p>`,
  rodape=`<div class="card"><h3>Zerar relatórios</h3><p class="m" style="margin:0 0 10px">${S.cfg.relDesde?"Contando só as vendas feitas depois de "+new Date(S.cfg.relDesde).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})+".":"Use depois dos testes pra começar a contar do zero. Nada é apagado do sistema."}</p><div class="row"><button class="bad" onclick="zerarRel()">Zerar relatórios</button>${S.cfg.relDesde?'<button onclick="voltarRel()">Voltar a contar tudo</button>':""}</div></div>`;
 if(!A.contas)return chips+info+'<div class="card"><p class="m">Nenhuma conta fechada neste período.</p></div>'+rodape;
 const kpi=(t,v)=>`<div class="kpi"><small>${t}</small><b>${v}</b></div>`,
  porHora=R.per==="hoje",ser=porHora?A.horas:A.serie,melhor=ser.reduce((m,x)=>x.v>m.v?x:m,{v:-1});
 return chips+info+`<div class="g" style="margin-bottom:12px">${kpi("Total vendido",brl(A.total))}${kpi("Contas fechadas",A.contas)}${kpi("Ticket médio",brl(A.total/A.contas))}${kpi("Itens vendidos",A.itens)}</div>
<div class="card"><h3>${porHora?"Vendas por hora":"Vendas por dia"} <small class="m">(R$)</small></h3>${colunas(ser)}<p class="m" style="margin:8px 0 0">${porHora?"Melhor horário":"Melhor dia"}: <b style="color:var(--t)">${esc(melhor.full)}</b> · ${brl(melhor.v)}</p>
<details style="margin-top:8px"><summary class="m" style="cursor:pointer;min-height:32px">Ver valores ${porHora?"por hora":"por dia"}</summary>${ser.map(x=>`<div class="ln"><span>${esc(x.full)}</span><b>${brl(x.v)}</b></div>`).join("")}</details></div>
<div class="card"><h3>Mais vendidos</h3>${hbar(A.top.map(x=>({n:x.n,v:x.qty,valor:x.valor})),r=>r.v+" un · "+brl(r.valor))}</div>
<div class="card"><h3>Vendas por garçom</h3>${hbar(A.garc,r=>brl(r.v))}</div>${rodape}`}

function vEquipe(){return `<div class="card"><h3>Novo funcionário</h3><div class="row"><input id="en" placeholder="Nome"><input id="eu" placeholder="Usuário (a-z, 0-9)" autocapitalize="none"><input id="ep" placeholder="Senha (mín. 6)"><select id="er"><option value="garcom">Garçom</option><option value="cozinha">Cozinha</option><option value="churrasqueiro">Churrasqueiro</option><option value="admin">Administrador</option></select></div><button class="pri" style="margin-top:10px" onclick="criar()">Criar conta</button></div><div class="card">${S.users.map(u=>`<div class="ln"><div><b>${esc(u.nome)}</b> <span class="m">${esc(u.usuario)} · ${u.role}${u.ativo===false?" · inativo":""}</span></div>${u.id===S.u.uid?"":`<div class="row" style="flex:0 0 auto;flex-wrap:nowrap"><button onclick="db.collection('users').doc('${u.id}').update({ativo:${u.ativo===false}})">${u.ativo===false?"Ativar":"Desativar"}</button><button class="bad" onclick="removerUser('${u.id}')">Remover</button></div>`}</div>`).join("")}</div>`}
async function criar(){const nome=$("#en").value.trim(),us=$("#eu").value.trim().toLowerCase(),pw=$("#ep").value,role=$("#er").value;
 if(!nome||!/^[a-z0-9._-]{3,}$/.test(us)||pw.length<6)return toast("Preencha nome, usuário (a-z, 0-9) e senha (6+)");
 const sec=firebase.apps.find(a=>a.name==="sec")||firebase.initializeApp(CFG,"sec");
 try{const c=await sec.auth().createUserWithEmailAndPassword(us+DOM,pw);await db.collection("users").doc(c.user.uid).set({nome,usuario:us,role,ativo:true});await sec.auth().signOut();toast("Conta criada: "+us);["#en","#eu","#ep"].forEach(i=>$(i).value="")}
 catch(e){toast(e.code==="auth/email-already-in-use"?"Esse usuário já existe":"Erro: "+e.code)}}
function vMesasAdm(){return `<div class="card"><div class="row"><input id="mn" placeholder="Nome (ex.: Mesa 13)"><button class="pri" onclick="addMesa()">Adicionar mesa</button>${S.mesas.length?"":'<button onclick="seedMesas()">Criar Mesas 1–12</button>'}</div></div><div class="card">${S.mesas.map(m=>`<div class="ln"><div><b>${esc(m.nome)}</b>${m.ativa===false?' <span class="m">· inativa</span>':""}</div><div class="row" style="flex:0 0 auto;flex-wrap:nowrap"><button onclick="renMesa('${m.id}')">Editar</button><button onclick="db.collection('mesas').doc('${m.id}').update({ativa:${m.ativa===false}})">${m.ativa===false?"Ativar":"Desativar"}</button></div></div>`).join("")}</div>`}
const addMesa=()=>{const n=$("#mn").value.trim();n&&db.collection("mesas").add({nome:n,ord:Date.now(),ativa:true})};
const seedMesas=()=>{const b=db.batch();for(let i=1;i<=12;i++)b.set(db.collection("mesas").doc(),{nome:"Mesa "+i,ord:i,ativa:true});b.commit()};
const renMesa=renomearMesa;
function vProdAdm(){return `<div class="card"><h3>Novo produto</h3><div class="row"><input id="pn" placeholder="Nome"><input id="pv" placeholder="Preço" inputmode="decimal"><input id="pc" placeholder="Categoria" list="cl"><datalist id="cl">${[...new Set(S.prods.map(p=>p.cat))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div><label><input type="checkbox" id="pp" checked style="width:auto;min-height:0"> Precisa de preparo (vai para a cozinha)</label><div class="row" style="margin-top:10px"><button class="pri" onclick="addP()">Adicionar</button>${S.prods.length?"":'<button onclick="seed()">Carregar cardápio padrão</button>'}</div></div>${listaProd()}`}
function addP(){const nome=$("#pn").value.trim(),preco=parseFloat($("#pv").value.replace(",",".")),cat=$("#pc").value.trim();if(!nome||!(preco>0)||!cat)return toast("Preencha nome, preço e categoria");db.collection("produtos").add({nome,preco,cat,prep:$("#pp").checked,ativo:true}).then(()=>["#pn","#pv"].forEach(i=>$(i).value=""))}
const fmtP=n=>Number(n).toFixed(2).replace(".",",");
function listaProd(){const por={};S.prods.forEach(p=>(por[p.cat]=por[p.cat]||[]).push(p));
 return Object.keys(por).sort().map(c=>`<div class="card"><h3>${esc(c)}</h3>${por[c].map(p=>`<div class="ln"${p.ativo===false?' style="opacity:.55"':""}><div style="flex:1;min-width:0"><b>${esc(p.nome)}</b>${p.fv?" 📷":""}${p.ativo===false?'<div class="m">fora do cardápio</div>':""}</div><input class="pi" inputmode="decimal" value="${fmtP(p.preco)}" onchange="setPreco('${p.id}',this.value)" aria-label="Preço"><button onclick="editP('${p.id}')" aria-label="Editar">✏️</button></div>`).join("")}</div>`).join("")}
function setPreco(id,v){const n=parseFloat(String(v).replace(",","."));if(!(n>0)){toast("Preço inválido");return render()}
 db.collection("produtos").doc(id).update({preco:n}).then(()=>toast("Preço salvo")).catch(e=>toast("Erro: "+e.code))}
const redim=f=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=c.height=200;const s=Math.min(i.width,i.height);c.getContext("2d").drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,200,200);ok(c.toDataURL("image/jpeg",.75))};i.onerror=no;i.src=URL.createObjectURL(f)});
function editP(id){const p=S.prods.find(x=>x.id===id);if(!p)return;let img=null,rm=false;
 const cats=[...new Set(S.prods.map(x=>x.cat))],chk='style="width:auto;min-height:0"';
 modal(`<h3>Editar produto</h3><label>Nome</label><input id="ep_n" maxlength="60" value="${esc(p.nome)}"><label>Preço</label><input id="ep_v" inputmode="decimal" value="${fmtP(p.preco)}"><label>Categoria</label><input id="ep_c" list="ep_l" value="${esc(p.cat)}"><datalist id="ep_l">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist><label><input type="checkbox" id="ep_p" ${p.prep?"checked":""} ${chk}> Precisa de preparo (vai pra cozinha)</label><label><input type="checkbox" id="ep_a" ${p.ativo===false?"":"checked"} ${chk}> Disponível (aparece no cardápio e pro garçom)</label><label>Foto (opcional)</label><div class="row" style="align-items:center;flex-wrap:nowrap"><img id="ep_i" class="ph" alt="" style="display:none"><input id="ep_f" type="file" accept="image/*"></div><button id="ep_r" style="margin-top:8px;display:none">Remover foto</button><div class="row" style="margin-top:12px"><button class="pri" id="ep_ok">Salvar</button><button onclick="fecharCmd()">Cancelar</button></div>`,()=>{
  const show=u=>{$("#ep_i").src=u;$("#ep_i").style.display="block";$("#ep_r").style.display="block"};
  if(p.fv)db.collection("fotos").doc(id).get().then(d=>{if(d.exists&&$("#ep_i")&&!img&&!rm)show(d.data().img)}).catch(()=>{});
  $("#ep_f").onchange=e=>{const f=e.target.files[0];f&&redim(f).then(u=>{img=u;rm=false;show(u)}).catch(()=>toast("Não consegui ler essa imagem"))};
  $("#ep_r").onclick=()=>{img=null;rm=true;$("#ep_i").style.display="none";$("#ep_r").style.display="none";$("#ep_f").value=""};
  $("#ep_ok").onclick=async()=>{const n=$("#ep_n").value.trim(),v=parseFloat($("#ep_v").value.replace(",",".")),c=$("#ep_c").value.trim();
   if(!n||!(v>0)||!c)return toast("Informe nome, preço e categoria");
   const up={nome:n,preco:v,cat:c,prep:$("#ep_p").checked,ativo:$("#ep_a").checked};
   try{if(img){const ts=Date.now();await db.collection("fotos").doc(id).set({img,ts});up.fv=ts}
    else if(rm&&p.fv){await db.collection("fotos").doc(id).delete();up.fv=firebase.firestore.FieldValue.delete()}
    await db.collection("produtos").doc(id).update(up);fecharCmd();toast("Produto salvo")}
   catch(e){toast("Erro: "+(e.code||e.message))}}})}
function seed(){const b=db.batch();SEED.split(";").forEach(c=>{const[h,l]=c.split("|"),[cat,pr]=h.split("*");l.split(",").forEach(x=>{const[n,v]=x.split(":");b.set(db.collection("produtos").doc(),{nome:n,preco:+v,cat,prep:pr==="1",ativo:true})})});b.commit().then(()=>toast("Cardápio carregado"))}
const vCfg=()=>`<div class="card"><label>Nome exibido no aplicativo</label><input id="cn" value="${esc(S.cfg.nome)}"><label>Cor principal</label><input id="cc" type="color" value="${esc(S.cfg.cor)}"><label>Logo (imagem quadrada)</label><input id="cl" type="file" accept="image/*"><button class="pri" style="margin-top:14px" onclick="saveCfg()">Salvar</button></div>`;
async function saveCfg(){const o={nome:$("#cn").value.trim()||"Espetinhos",cor:$("#cc").value},f=$("#cl").files[0];
 if(f)o.logo=await new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=c.height=128;const s=Math.min(i.width,i.height);c.getContext("2d").drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,128,128);r(c.toDataURL("image/jpeg",.8))};i.src=URL.createObjectURL(f)});
 db.collection("config").doc("app").set(o,{merge:true}).then(()=>toast("Configurações salvas")).catch(e=>toast("Erro: "+e.code))}
if("serviceWorker"in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
