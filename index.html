 if(reprecificar()){render();return toast("🍻 O Happy Hour mudou: preços atualizados. Confira e envie de novo.")}

<div class="card"><h3>Deliveries em andamento</h3>${minhas.map(p=>`<div style="padding-bottom:10px;margin-bottom:10px;border-bottom:1px dashed var(--ln)">${cardPed(p,0,1)}<div class="ln" style="border:0;padding:0"><b class="tot" style="margin:0;font-size:20px">${money(tot([p]))}</b><button class="ok" onclick="finalizarD('${p.id}')">✅ Finalizar venda</button></div></div>`).join("")||'<p class="m">Nenhum delivery em aberto.</p>'}</div>${d.length?`<div class="sendbar"><div><b>${qn} iten${qn===1?"":"s"}</b><small>${money(d.reduce((a,i)=>a+i.preco*i.qty,0))}</small></div><button class="pri" onclick="enviarD()">Enviar delivery</button></div>`:""}`}
function delCard(d,per){const L=d.peds.filter(isDel);
 if(!L.length)return `<div class="card"><h3>🛵 Delivery</h3><p class="m" style="margin:0">Nenhuma venda no delivery neste período.</p></div>`;

/* ===== ALERTA DO GARÇOM: toca e vibra SEM PARAR até o garçom apertar o botão =====
   Vale pra "pedido/item pronto" e pra "cozinha chamando". Se chegar outro aviso com o alarme tocando, ele entra na mesma lista.
   ALARME_MS = intervalo entre uma sirene e outra | MANTER_TELA = true segura a tela do garçom ligada (o celular só toca com o app aberto; gasta mais bateria) */
const ALARME_MS=2200,MANTER_TELA=true;
let alT=null,wl=null;
const sirene=()=>{try{ac=ac||new AC();const go=()=>{const t=ac.currentTime;
  [[988,0],[1319,.22],[988,.44],[1319,.66]].forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type="square";o.frequency.value=f;
   g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(1,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.2);
   o.connect(g);g.connect(ac.destination);o.start(t+d);o.stop(t+d+.21)})};
  ac.state==="running"?go():ac.resume().then(go).catch(()=>{})}catch(e){}};
const alarmeCiclo=()=>{sirene();hap([400,120,400,120,400,120,400])};
const alarmeIni=()=>{if(alT)return;alarmeCiclo();alT=setInterval(alarmeCiclo,ALARME_MS)};
const alarmeFim=()=>{clearInterval(alT);alT=null;hap(0)};
function alerta(ico,tit,msg){S.al=S.al||[];S.al.push({ico,tit,msg});desenharAlerta();alarmeIni()}
function desenharAlerta(){const l=S.al||[];if(!l.length){$("#chm").innerHTML="";return}
 $("#chm").innerHTML=`<div class="box"><div class="card"><div style="font-size:52px;line-height:1.2">${l[l.length-1].ico}</div>${l.slice(-4).reverse().map(a=>`<div class="ln" style="flex-direction:column;gap:2px;text-align:center"><h2 style="margin:0">${esc(a.tit)}</h2>${a.msg?`<p style="margin:0">${esc(a.msg)}</p>`:""}</div>`).join("")}${l.length>4?`<p class="m" style="margin:8px 0 0">+ ${l.length-4} aviso(s) anterior(es)</p>`:""}<button class="pri" style="width:100%;margin-top:12px;min-height:64px;font-size:20px" onclick="okAlerta()">${l.length>1?"Ciente de todos ("+l.length+")":"Já vou"}</button></div></div>`}
const okAlerta=()=>{S.al=[];alarmeFim();$("#chm").innerHTML=""};
function alertaCozinha(c){const ms=(c.mesas||[]).join(", ");
 alerta("🔔",(c.quem==="churrasqueiro"?"Churrasqueira":"Cozinha")+" chamando!",(c.de||"Cozinha")+(ms?" · Pronto: "+ms:""))}
/* mantém a tela ligada no celular do garçom (o navegador solta isso sozinho ao minimizar; pedimos de novo ao voltar/tocar) */
const manterTela=async()=>{if(!MANTER_TELA||wl||!S.u||S.u.role!=="garcom"||!("wakeLock"in navigator))return;
 try{wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}catch(e){wl=null}};
["pointerdown","touchend"].forEach(ev=>addEventListener(ev,manterTela,{passive:true}));
document.addEventListener("visibilitychange",()=>{if(!document.hidden){destravar();manterTela();if(alT)alarmeCiclo();hhTick();render()}});
/* categorias que vão SÓ pro churrasqueiro (em minúsculas). Pra incluir outra, é só acrescentar, ex.: ["espetinhos","pão de alho"] */
const CATS_CHURRASCO=["espetinhos"];
const destino=p=>!p.prep?"":CATS_CHURRASCO.includes(String(p.cat||"").trim().toLowerCase())?"churrasco":"cozinha",
 estacao=()=>S.u.role==="churrasqueiro"?"churrasco":"cozinha",
 meu=(i,e)=>i.prep&&(i.dest||"cozinha")===e,   /* pedidos antigos, sem destino, contam como cozinha */
 pendEst=(p,e)=>p.itens.filter((i,k)=>meu(i,e)&&!(p.prontos||[]).includes(k)).length,
 temPronto=p=>p.status==="pronto"||(p.status!=="entregue"&&(p.prontos||[]).length>0),
 parcial=p=>{const t=p.itens.filter(i=>i.prep).length,n=(p.prontos||[]).length;return["novo","preparo"].includes(p.status)&&n>0&&t>1?`<br><small class="m">${n}/${t} prontos</small>`:""};
function itensCozinha(p,e){const pr=p.prontos||[];
 return p.itens.map((i,k)=>{if(!meu(i,e))return"";const f=pr.includes(k);
  return `<div class="ln"${f?' style="opacity:.55"':""}><div style="flex:1"><b>${f?"✅ ":""}${i.qty}× ${esc(i.nome)}</b>${i.obs?` <span class="tag">${esc(i.obs)}</span>`:""}</div>${f?`<button onclick="itemDesfazer('${p.id}',${k})">Desfazer</button>`:`<button class="ok" onclick="itemPronto('${p.id}',${k})">Pronto</button>`}</div>`}).join("")}
/* transação: duas estações (ou dois cozinheiros) mexendo no mesmo pedido ao mesmo tempo não se atropelam.
   O pedido só vira "pronto" quando TODOS os itens de preparo, de qualquer estação, estiverem prontos. */
function marcar(id,ks,pronto){const ref=db.collection("pedidos").doc(id);
 db.runTransaction(async t=>{const d=await t.get(ref);if(!d.exists)return;const p=d.data(),ps=new Set(p.prontos||[]);
  ks.forEach(k=>pronto?ps.add(k):ps.delete(k));
  const todos=p.itens.every((i,j)=>!i.prep||ps.has(j));
  t.update(ref,{prontos:[...ps].sort((a,b)=>a-b),status:todos?"pronto":"preparo"})}).catch(e=>toast("Erro: "+(e.code||e.message)))}
const itemPronto=(id,k)=>marcar(id,[k],true),itemDesfazer=(id,k)=>marcar(id,[k],false);
function todosProntos(id){const p=S.peds.find(x=>x.id===id);if(!p)return;const e=estacao();
 marcar(id,p.itens.map((i,k)=>meu(i,e)?k:-1).filter(k=>k>=0),true)}
const urg=p=>ago(p)>=20?"u2":ago(p)>=10?"u1":"";
function vPainel(){const e=estacao(),ms=S.mesas.filter(m=>m.ativa!==false),
 est=m=>{const l=S.peds.filter(p=>p.mesaId===m.id);return!l.length?"livre":l.some(temPronto)?"pronto":l.some(p=>p.status==="preparo")?"preparo":l.some(p=>p.status==="novo")?"novo":"servida"},
 cl={livre:"",novo:"occ",preparo:"prep",pronto:"rdy",servida:"occ"},tx={livre:"Livre",novo:"Aguardando",preparo:"Em preparo",pronto:"Pronto",servida:"Servida"},
 meus=S.peds.filter(p=>p.status!=="entregue"&&p.itens.some(i=>meu(i,e))),
 N=meus.filter(p=>p.status==="novo"&&pendEst(p,e)>0),P=meus.filter(p=>p.status==="preparo"&&pendEst(p,e)>0),R=meus.filter(p=>p.status==="pronto"||pendEst(p,e)===0),
 kp=(t,v)=>`<div class="kpi"><small>${t}</small><b>${v}</b></div>`,
 lista=(t,l)=>`<div class="card"><h3>${t} <span class="tag">${l.length}</span></h3>${l.map(p=>`<div class="ln ${p.status==="pronto"?"":urg(p)}"><div><b>${esc(p.mesaNome)}</b> <span class="m">${ago(p)} min · ${esc(p.garcomNome)}</span><div class="m">${p.itens.filter(i=>meu(i,e)).map(i=>i.qty+"× "+esc(i.nome)).join(", ")}</div></div></div>`).join("")||'<p class="m" style="margin:0">Nada por aqui.</p>'}</div>`;
 return `<div class="g" style="margin-bottom:12px">${kp("Mesas ocupadas",ms.filter(m=>est(m)!=="livre").length+" / "+ms.length)}${kp("Na fila",N.length)}${kp("Em preparo",P.length)}${kp("Prontos",R.length)}</div>
<div class="card"><h3>Mesas</h3><div class="mg">${ms.map(m=>`<div class="mc ${cl[est(m)]}"><b>${esc(m.nome)}</b><small>${tx[est(m)]}</small></div>`).join("")}</div></div>
<div class="g2">${lista("Enviados",N)}${lista("Em preparo",P)}${lista("Prontos",R)}</div>`}
function vFila(){const e=estacao(),l=S.peds.filter(p=>["novo","preparo"].includes(p.status)&&pendEst(p,e)>0);
 return `<button class="pri" style="width:100%;min-height:64px;font-size:20px;margin-bottom:12px" onclick="chamar()">🔔 Chamar garçom</button><div class="g2">${l.map(p=>`<div class="card ${urg(p)}"><h2>${esc(p.mesaNome)} <small class="m">${ago(p)} min · ${LBL[p.status]}</small></h2><div class="m">Garçom: ${esc(p.garcomNome)}</div>${itensCozinha(p,e)}<div class="row" style="margin-top:10px">${p.status==="novo"?`<button onclick="setSt('${p.id}','preparo')">Em preparo</button>`:""}${pendEst(p,e)>1?`<button class="ok" onclick="todosProntos('${p.id}')">Tudo pronto</button>`:""}</div></div>`).join("")||'<p class="m">Fila limpa 🎉</p>'}</div>`}
const setSt=(id,s)=>db.collection("pedidos").doc(id).update({status:s}).catch(e=>toast("Sem permissão: "+e.code));
/* feedback do toque: vibra (só Android) + "tic" curtinho. TIC_SOM=false desliga o som */
const TIC_SOM=true;
const hap=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const tic=()=>{if(!TIC_SOM)return;try{ac=ac||new AC();const go=()=>{const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=1100;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.06);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.07)};
 ac.state==="running"?go():ac.resume().then(go).catch(()=>{})}catch(e){}};
const toque=(p=30)=>{hap(p);tic()};
function add(id){const p=S.prods.find(x=>x.id===id),d=S.draft[S.mesa]=S.draft[S.mesa]||[],x=d.find(i=>i.pid===id&&!i.obs);x?x.qty++:d.push({pid:id,nome:p.nome,preco:precoAtual(p),hh:isHH(p),prep:!!p.prep,dest:destino(p),qty:1,obs:""});S.pop=id;toque();render();S.pop=null}
function qty(k,n){const d=S.draft[S.mesa];if(!d||!d[k])return;d[k].qty+=n;if(d[k].qty<1)d.splice(k,1);toque(25);render()}
function rmDraft(k){const d=S.draft[S.mesa];if(!d||!d[k])return;d.splice(k,1);toque(25);render()}
/* tirar item de um pedido JÁ ENVIADO (garçom se confundiu). Remove 1 unidade ou a linha toda.
   Os "prontos" guardam o número da linha, então ao tirar uma linha os números seguintes são reajustados. */
function tirarItem(id,k){const p=S.peds.find(x=>x.id===id),i=p&&p.itens[k];if(!i)return toast("Esse item não está mais no pedido");
 const um=i.qty>1,aviso=(p.prontos||[]).includes(k)||p.status==="entregue"?"Esse item já foi preparado. ":p.status!=="novo"?"A cozinha já está com esse pedido: avise para não preparar. ":"";
 modal(`<h3>Tirar do pedido?</h3><p style="margin:0 0 6px"><b>${i.qty}× ${esc(i.nome)}</b><br><span class="m">${esc(p.mesaNome)}</span></p>${aviso?`<p class="m" style="margin:0 0 12px;color:#ffb21a">⚠️ ${esc(aviso)}</p>`:'<div style="height:6px"></div>'}<div class="stk">${um?`<button id="ti1" style="min-height:52px">Tirar só 1 (ficam ${i.qty-1})</button>`:""}<button class="danger" id="tiall" style="min-height:52px">${um?"Remover todos ("+i.qty+")":"Remover item"}</button><button onclick="fecharCmd()">Cancelar</button></div>`,()=>{
  const u=$("#ti1");if(u)u.onclick=()=>{fecharCmd();ajustarItem(id,k,i.nome,true)};
  $("#tiall").onclick=()=>{fecharCmd();ajustarItem(id,k,i.nome,false)}})}
function ajustarItem(id,k,nome,um){const ref=db.collection("pedidos").doc(id);
 db.runTransaction(async t=>{const d=await t.get(ref);if(!d.exists)throw{code:"pedido-nao-existe"};const p=d.data();
  if(!p.aberto)throw{code:"conta-ja-fechada"};
  const itens=p.itens.map(x=>({...x}));if(!itens[k]||itens[k].nome!==nome)throw{code:"pedido-mudou"};
  if(um&&itens[k].qty>1){itens[k].qty--;t.update(ref,{itens});return}
  itens.splice(k,1);const pr=(p.prontos||[]).filter(j=>j!==k).map(j=>j>k?j-1:j);
  if(!itens.length){t.update(ref,{itens:[],prontos:[],status:"entregue",aberto:false});return}   /* pedido ficou vazio: sai da lista */
  const ip=itens.map((x,j)=>x.prep?j:-1).filter(j=>j>=0);let st=p.status;
  if(!ip.length)st="entregue";else if(ip.every(j=>pr.includes(j))&&["novo","preparo"].includes(st))st="pronto";
  t.update(ref,{itens,prontos:pr,status:st})})
 .then(()=>{toast("Item removido");toque([30,40,30])}).catch(e=>toast(e.code==="pedido-mudou"?"O pedido mudou, confira e tente de novo":e.code==="conta-ja-fechada"?"Essa conta já foi fechada":"Erro: "+(e.code||e.message)))}
function enviar(){const d=S.draft[S.mesa]||[],m=S.mesas.find(x=>x.id===S.mesa);if(!d.length)return;
 if(reprecificar()){render();return toast("🍻 O Happy Hour mudou: preços atualizados. Confira e envie de novo.")}
 db.collection("pedidos").add({mesaId:m.id,mesaNome:m.nome,garcomUid:S.u.uid,garcomNome:S.u.nome,itens:d.map(({nome,preco,qty,obs,prep,dest,hh})=>({nome,preco,qty,obs:obs||"",prep,dest:dest||"",hh:!!hh})),status:d.some(i=>i.prep)?"novo":"entregue",aberto:true,ts:Date.now()})
 .then(()=>{delete S.draft[S.mesa];toast("Pedido enviado");toque([40,60,40]);render()}).catch(e=>{hap([150,80,150]);toast("Erro ao enviar: "+e.code)})}
/* ===== COMANDA: impressão (RawBT) + comanda virtual ===== */
const PAPEL=32;          // colunas por linha: 32 = bobina 58mm | 48 = bobina 80mm
const SEM_ACENTO=true;   // true evita letras estranhas em impressoras que não entendem acento
const sa=s=>SEM_ACENTO?String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,""):String(s);
const brl=n=>money(n).replace(/\u00a0/g," ");

/* ===== QR CODE DO PIX (aparece na comanda da tela e na impressa) =====
   PIX_ATIVO=false esconde o QR. PIX_NOME é o recebedor que aparece embaixo do QR.
   PIX_BITS é a matriz do QR (49x49, 1 = módulo preto). O QR é o seu Pix estático: o cliente digita o valor. */
const PIX_ATIVO=true,PIX_NOME="Jose Orlando Aires Cabral",PIX_N=49,PIX_Q=4,
 PIX_BITS="1111111001000111110011111110111101111100101111111100000100010110111010111010001011100011110100000110111010111011101110110110100110001100011010111011011101001110101010101110010011001010001001011101101110100001111101110111111110110110000000101110110000010001101011001101000101111011001100010000011111111010101010101010101010101010101010101111111000000001100011010001110001011011010001010000000011101111101100101011001111101101101110100110001001111010111100010001100000101000010000100000111011001101101111110001001000110011011010110110001001101111001101001110111010111011010110011010100110111011111100000101110111011000111011101000011011001000110010011110101010100100101010100100101010010110001110011001111011111010111101110010100100101010111110100111001001101010110100010110000000010010100010100100001100110111011010101101100001111000101101100101010110011010111001001010101000000010010010101101110010101011010100110011001100010000111001101001101100100010000110010011000110100001100111110010011010101010100010001011110011011010110100011010001111000100010100001110001000000000101001000011111111000000100111111111001100101111111110100011000110100001100111000101000100001001000100100101101011100011001101101010110010011011101010001000110001011001100110010001110000101010010001101010101111110001001100101111111000110011011111111110111110010000111111101010101110111001100110101010101000101000110111011011101110111110100010100100110101100001011010101011100001100010101000010001011110101011000011101111111110110101001000101110001010001011000111100110111011011101101110111110001001111010011100110011001000101010100010100011000010000000010001011001101100111100001001100111101011111111101100101110101010111011111101010011101000111110001010000000000011001011111111010101001110001011001110001010101010001111101011101000001011011100101011100100010001110111001000101000101000000101000110001001100000011001101101110001101110101010111000001001000100010101110100011010111110100000111000100111011100110111111011001111111011111001000000000110001010011001000101001010000011000100111111111011110100010010101011101011001111101010011100000101110111001110010001111001110010010001100110111010100111011101111111111100101110111111110011011101000010101010101011100010001000001110010100101110101111100110011011110100000100001110001100010000010100101110101011001011010100101001100010101111111011100111001100111011101010111100100110011";
const pixBit=(r,c)=>r<0||c<0||r>=PIX_N||c>=PIX_N?0:PIX_BITS.charCodeAt(r*PIX_N+c)-48;
function pixSvg(){let d="";
 for(let r=0;r<PIX_N;r++){let c=0;while(c<PIX_N){if(!pixBit(r,c)){c++;continue}let a=c;while(c<PIX_N&&pixBit(r,c))c++;d+="M"+(a+PIX_Q)+","+(r+PIX_Q)+"h"+(c-a)+"v1h-"+(c-a)+"z"}}
 const t=PIX_N+2*PIX_Q;
 return `<svg viewBox="0 0 ${t} ${t}" role="img" aria-label="QR code Pix" shape-rendering="crispEdges" style="display:block;margin:8px auto;width:min(100%,230px);height:auto;background:#fff"><rect width="${t}" height="${t}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}
/* mesmo QR em bitmap pra impressora térmica (comando ESC/POS "GS v 0"), centralizado na largura do papel */
function pixRaster(){
 const W=PAPEL>=48?576:384,t=PIX_N+2*PIX_Q,k=Math.max(1,Math.floor(W/t)),px=t*k,off=Math.floor((W-px)/2),bpr=W/8,out=new Uint8Array(8+bpr*px);
 out.set([0x1d,0x76,0x30,0,bpr&255,bpr>>8,px&255,px>>8]);
 for(let y=0;y<px;y++){const r=Math.floor(y/k)-PIX_Q;
  for(let x=0;x<px;x++){const c=Math.floor(x/k)-PIX_Q;if(pixBit(r,c)){const X=off+x;out[8+y*bpr+(X>>3)]|=0x80>>(X&7)}}}
 return out}
/* comanda na tela: o QR entra no lugar da marca {qr:1} da lista de linhas */
function htmlComanda(c){const L=linhasComanda(c),f=l=>l.b?`<b>${esc(l.s)}</b>`:esc(l.s),pre=a=>`<pre>${a.map(f).join("\n")}</pre>`,k=L.findIndex(l=>l.qr);
 return k<0?pre(L):pre(L.slice(0,k))+pixSvg()+pre(L.slice(k+1))}

function montarComanda(m,ps){
 const mapa=new Map();
 ps.forEach(p=>p.itens.forEach(i=>{const k=i.nome+"|"+(i.obs||"")+"|"+i.preco,x=mapa.get(k);
  x?x.qty+=i.qty:mapa.set(k,{nome:i.nome,obs:i.obs||"",preco:i.preco,qty:i.qty,hh:!!i.hh})}));
 const itens=[...mapa.values()];
 return{mesa:m.nome,garcom:S.u.nome,loja:S.cfg.nome,ts:Date.now(),itens,total:itens.reduce((s,i)=>s+i.preco*i.qty,0)}}

/* devolve a lista de linhas [{s:texto, b:negrito}] — a mesma lista vai pra tela e pra impressora */
function linhasComanda(c){
 const L=PAPEL,tr="-".repeat(L),
  lin=(a,b)=>a.slice(0,Math.max(0,L-b.length-1)).padEnd(L-b.length)+b,
  ctr=s=>" ".repeat(Math.max(0,Math.floor((L-s.length)/2)))+s,
  wrap=(s,w)=>{const o=[];while(s.length>w){let k=s.lastIndexOf(" ",w);if(k<1)k=w;o.push(s.slice(0,k));s=s.slice(k).trimStart()}o.push(s);return o},
  d=new Date(c.ts),dh=d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),
  r=[],add=(s,b)=>r.push({s,b:!!b});
 add(ctr(sa(c.loja)),1);add(ctr("COMANDA"));add(tr);
 add(sa((c.delivery?"Pedido: ":"Mesa: ")+c.mesa),1);add(sa("Garcom: "+c.garcom));add(dh);add(tr);
 c.itens.forEach(i=>{
  const w=wrap(sa(i.qty+"x "+i.nome+(i.hh?" (HH)":"")),L),v=brl(i.preco*i.qty),u=w.pop();
  w.forEach(x=>add(x));
  if(u.length+v.length<L)add(lin(u,v));else{add(u);add(lin("",v))}
  if(i.obs)wrap("("+sa(i.obs)+")",L-2).forEach(x=>add("  "+x))});
 add(tr);add(lin("TOTAL",brl(c.total)),1);add(tr);
 if(PIX_ATIVO){add(ctr("PAGUE COM PIX"),1);r.push({qr:1});wrap(sa(PIX_NOME),L).forEach(x=>add(ctr(x)));add(tr)}
 add(ctr("Obrigado!"));add(ctr("Sem valor fiscal"));
 return r}

function bytesComanda(c){
 const E=new TextEncoder(),p=[],raw=(...b)=>p.push(Uint8Array.from(b));
 raw(0x1b,0x40);                                   // iniciar impressora
 linhasComanda(c).forEach(l=>{if(l.qr){raw(0x1b,0x45,0);p.push(pixRaster());p.push(E.encode("\n"));return}raw(0x1b,0x45,l.b?1:0);p.push(E.encode(l.s+"\n"))}); // negrito + texto
 raw(0x1b,0x45,0);raw(0x1b,0x64,4);                // desliga negrito e avança 4 linhas
 const u=new Uint8Array(p.reduce((a,x)=>a+x.length,0));let o=0;p.forEach(x=>{u.set(x,o);o+=x.length});return u}

function b64(u){let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}

function imprimir(c){
 try{location.href="intent:base64,"+b64(bytesComanda(c))+"#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;"}
 catch(e){toast("Não foi possível imprimir. Use a comanda na tela.")}}

const st=t=>{const e=$("#cst");if(e)e.textContent=t};
function mostrarComanda(c){S.cmd=c;
 $("#cmd").innerHTML=`<div class="mdl" onclick="if(event.target===this)fecharCmd()"><div class="box"><div class="cupom">${htmlComanda(c)}</div><div id="cst" class="m" style="text-align:center;margin-bottom:8px"></div><div class="row"><button class="pri" onclick="imprimir(S.cmd)">🖨️ Imprimir</button><button onclick="fecharCmd()">Fechar</button></div></div></div>`}
const fecharCmd=()=>{$("#cmd").innerHTML=""};
/* ===== janelas próprias (no lugar de prompt/confirm) ===== */
function modal(html,bind){$("#cmd").innerHTML=`<div class="mdl" onclick="if(event.target===this)fecharCmd()"><div class="box"><div class="card">${html}</div></div></div>`;bind&&bind()}
function pedirTexto(titulo,valor,ok,tipo){
 modal(`<h3>${esc(titulo)}</h3><input id="pt" type="${tipo||"text"}" maxlength="60" value="${esc(valor)}" autocomplete="off"><div class="row" style="margin-top:12px"><button class="pri" id="ptok">Salvar</button><button onclick="fecharCmd()">Cancelar</button></div>`,()=>{
  const i=$("#pt"),go=()=>{const v=i.value.trim();if(!v)return;fecharCmd();ok(v)};
  i.focus();i.select();$("#ptok").onclick=go;i.onkeydown=e=>{if(e.key==="Enter")go()}})}

 modal(`<h3>${esc(titulo)}</h3><p class="m" style="margin:0 0 12px">${esc(msg)}</p><div class="row"><button class="${perigo?"bad":"pri"}" id="cfok">Confirmar</button><button onclick="fecharCmd()">Cancelar</button></div>`,()=>{
  $("#cfok").onclick=()=>{fecharCmd();ok()}})}

  .then(()=>toast("Mesa criada")).catch(e=>toast("Sem permissão: "+e.code)));

function guardarUltima(c){try{localStorage.setItem("ultimaComanda",JSON.stringify(c))}catch(e){}}

function fechar(){
 const m=S.mesas.find(x=>x.id===S.mesa),ps=S.peds.filter(p=>p.mesaId===S.mesa);
 if(!m||!ps.length)return;
 confirmar("Fechar a conta?",m.nome+" · "+money(tot(ps)),()=>fecharConta(m,ps))}
function fecharConta(m,ps){
 const c=montarComanda(m,ps),b=db.batch(),agora=Date.now();
 ps.forEach(p=>b.update(db.collection("pedidos").doc(p.id),{aberto:false,fechadoEm:agora}));
 guardarUltima(c);mostrarComanda(c);st("Fechando conta…");
 const r=b.commit();imprimir(c);
 r.then(()=>{toast("Conta fechada");st("✅ Conta fechada")})
  .catch(e=>{toast("Erro: "+e.code);st("⚠️ A conta NÃO foi fechada ("+e.code+")")})}

/* ===== RELATÓRIOS (admin) ===== */
/* faturamento da COZINHA = vendas dos produtos destas categorias (em minúsculas). Pra incluir outra, é só acrescentar na lista.
   Itens do Happy Hour entram sozinhos: são os mesmos produtos (caldinhos, pastéis, ensopados) com o preço promocional.
   Espetinhos, cervejas, cachaças e doses ficam de fora. */
const CATS_FAT=["pão de alho","pra beliscar","pastéis","caldinhos","sucos"],
 ncat=x=>String(x||"").trim().toLowerCase(),
 soCoz=peds=>{const m=new Map(S.prods.map(x=>[x.id,x]));
  /* categoria atual do produto; se o produto foi apagado, só conta se o pedido já gravou destino "cozinha" */
  const ok=i=>{const x=m.get(i.pid);return x?CATS_FAT.includes(ncat(x.cat)):i.dest==="cozinha"};
  return peds.map(p=>({...p,itens:(p.itens||[]).filter(ok)})).filter(p=>p.itens.length)};
const VIRADA=5; // o "dia de vendas" só vira às 5h da manhã: venda feita à 1h conta no dia anterior
const PERS=[["hoje","Hoje"],["7d","7 dias"],["30d","30 dias"],["mes","Este mês"]];
S.rel={per:"7d",dados:{},carregando:false,erro:""};
const p2=n=>String(n).padStart(2,"0"),
 baseDia=()=>{const d=new Date(Date.now()-VIRADA*36e5);return[d.getFullYear(),d.getMonth(),d.getDate()]},
 iniPer=p=>{const[y,m,d]=baseDia();return Math.max(S.cfg.relDesde||0,new Date(y,m,p==="hoje"?d:p==="7d"?d-6:p==="30d"?d-29:1,VIRADA).getTime())},
 dk=ts=>{const d=new Date(ts-VIRADA*36e5);return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())},
 curto=n=>n>=1000?(n/1000).toFixed(1).replace(".",",").replace(",0","")+"k":String(Math.round(n)),
 SEM=["dom","seg","ter","qua","qui","sex","sáb"];

async function carregarRel(){
 const R=S.rel,per=R.per;if(R.carregando)return;R.carregando=true;R.erro="";
 try{const ini=iniPer(per),s=await db.collection("pedidos").where("fechadoEm",">=",ini).get();
  R.dados[per]={peds:s.docs.map(d=>d.data()),ini,quando:Date.now()}}
 catch(e){R.erro=e.code||String(e)}
 R.carregando=false;render()}
const relRef=()=>{S.rel.erro="";carregarRel();render()};

function agregar(peds,ini,per){
 const dias=new Map(),horas=Array(24).fill(0),prods=new Map(),garc=new Map(),contas=new Set();let total=0,itens=0;
 peds.forEach(p=>{const its=p.itens||[],v=its.reduce((a,i)=>a+i.preco*i.qty,0),f=p.fechadoEm;total+=v;
  dias.set(dk(f),(dias.get(dk(f))||0)+v);
  horas[(new Date(f).getHours()-VIRADA+24)%24]+=v;
  const g=p.garcomNome||"?";garc.set(g,(garc.get(g)||0)+v);
  contas.add(p.mesaId+"|"+Math.floor(f/2000));
  its.forEach(i=>{const k=i.nome+"|"+i.preco,x=prods.get(k)||{nome:i.nome,preco:i.preco,qty:0,valor:0};
   x.qty+=i.qty;x.valor+=i.preco*i.qty;itens+=i.qty;prods.set(k,x)})});
 /* série por dia: preenche também os dias sem venda */
 const serie=[],cur=new Date(ini),hoje=dk(Date.now());
 for(let n=0;n<400;n++){const k=dk(cur.getTime()),sd=new Date(cur.getTime()-VIRADA*36e5);
  serie.push({k,v:dias.get(k)||0,l:per==="7d"?SEM[sd.getDay()]+" "+sd.getDate():String(sd.getDate()),
   full:sd.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit"})});
  if(k>=hoje)break;cur.setDate(cur.getDate()+1)}
 /* série por hora (usada no "Hoje"): corta as horas vazias das pontas */
 let h=horas.map((v,k)=>({v,l:((VIRADA+k)%24)+"h",full:((VIRADA+k)%24)+"h"}));
 const a=h.findIndex(x=>x.v>0),z=h.length-1-[...h].reverse().findIndex(x=>x.v>0);
 h=a<0?[]:h.slice(a,z+1);
 const nomes={};[...prods.values()].forEach(x=>{(nomes[x.nome]=nomes[x.nome]||new Set()).add(x.preco)});
 const top=[...prods.values()].sort((x,y)=>y.qty-x.qty||y.valor-x.valor).slice(0,10)
  .map(x=>({...x,n:nomes[x.nome].size>1?x.nome+" ("+brl(x.preco)+")":x.nome}));
 return{total,itens,contas:contas.size,serie,horas:h,top,garc:[...garc].map(([n,v])=>({n,v})).sort((x,y)=>y.v-x.v)}}

const colunas=it=>{const mx=Math.max(1,...it.map(x=>x.v)),n=it.length,H=130,step=n>14?Math.ceil(n/8):1;
 return `<div class="cols">${it.map((x,k)=>`<div class="col"><span class="v">${n<=10&&x.v?curto(x.v):""}</span><i class="b${x.v?"":" z"}" style="height:${x.v?Math.max(3,Math.round(x.v/mx*H)):2}px"></i><span class="l">${k%step===0?esc(x.l):""}</span></div>`).join("")}</div>`};
const hbar=(rows,fmt)=>{const mx=Math.max(1,...rows.map(r=>r.v));
 return rows.map(r=>`<div><div class="hl"><span>${esc(r.n)}</span><b>${fmt(r)}</b></div><div class="ht"><i style="width:${Math.round(r.v/mx*100)}%"></i></div></div>`).join("")};

function zerarRel(){
 confirmar("Zerar os relatórios?","As vendas feitas até agora deixam de aparecer nos números e gráficos. Nada é apagado do sistema, e dá pra voltar a contar tudo depois.",()=>defDesde(Date.now()),1)}

 .then(()=>{S.cfg.relDesde=t;S.rel.dados={};S.rel.erro="";render();toast(t?"Relatórios zerados":"Contando todas as vendas")})

 if(!A.contas)return chips+info+'<div class="card"><p class="m">Nenhuma conta fechada neste período.</p></div>'+rodape;
 const kpi=(t,v)=>`<div class="kpi"><small>${t}</small><b>${v}</b></div>`,
  C=agregar(soCoz(d.peds),d.ini,R.per),
  coz=`<div class="card"><h3>🍳 Faturamento da cozinha <small class="m">(pão de alho, pra beliscar, pastéis, caldinhos e sucos)</small></h3><div class="g" style="margin-bottom:10px">${kpi("Faturou em comida",brl(C.total))}${kpi("% do total",A.total?Math.round(C.total/A.total*100)+"%":"–")}${kpi("Itens da cozinha",C.itens)}</div>${C.top.length?hbar(C.top.slice(0,5).map(x=>({n:x.n,v:x.qty,valor:x.valor})),r=>r.v+" un · "+brl(r.valor)):'<p class="m" style="margin:0">Nenhuma comida vendida neste período.</p>'}</div>`,
  porHora=R.per==="hoje",ser=porHora?A.horas:A.serie,melhor=ser.reduce((m,x)=>x.v>m.v?x:m,{v:-1});
 return chips+info+`<div class="g" style="margin-bottom:12px">${kpi("Total vendido",brl(A.total))}${kpi("Contas fechadas",A.contas)}${kpi("Ticket médio",brl(A.total/A.contas))}${kpi("Itens vendidos",A.itens)}</div>${coz}${delCard(d,R.per)}
<div class="card"><h3>${porHora?"Vendas por hora":"Vendas por dia"} <small class="m">(R$)</small></h3>${colunas(ser)}<p class="m" style="margin:8px 0 0">${porHora?"Melhor horário":"Melhor dia"}: <b style="color:var(--t)">${esc(melhor.full)}</b> · ${brl(melhor.v)}</p>
<details style="margin-top:8px"><summary class="m" style="cursor:pointer;min-height:32px">Ver valores ${porHora?"por hora":"por dia"}</summary>${ser.map(x=>`<div class="ln"><span>${esc(x.full)}</span><b>${brl(x.v)}</b></div>`).join("")}</details></div>
<div class="card"><h3>Mais vendidos</h3>${hbar(A.top.map(x=>({n:x.n,v:x.qty,valor:x.valor})),r=>r.v+" un · "+brl(r.valor))}</div>
<div class="card"><h3>Vendas por garçom</h3>${hbar(A.garc,r=>brl(r.v))}</div>${rodape}`}

 const chips=`<div class="chips">${PERS.map(([k,n])=>`<button class="${R.per===k?"pri":""}" onclick="S.rel.per='${k}';S.rel.erro='';render()">${n}</button>`).join("")}<button onclick="relRef()">🔄 Atualizar</button></div>`;

function vEquipe(){return `<div class="card"><h3>Novo funcionário</h3><div class="row"><input id="en" placeholder="Nome"><input id="eu" placeholder="Usuário (a-z, 0-9)" autocapitalize="none"><input id="ep" placeholder="Senha (mín. 6)"><select id="er"><option value="garcom">Garçom</option><option value="cozinha">Cozinha</option><option value="churrasqueiro">Churrasqueiro</option><option value="admin">Administrador</option></select></div><button class="pri" style="margin-top:10px" onclick="criar()">Criar conta</button></div><div class="card">${S.users.map(u=>`<div class="ln"><div><b>${esc(u.nome)}</b> <span class="m">${esc(u.usuario)} · ${u.role}${u.ativo===false?" · inativo":""}</span></div>${u.id===S.u.uid?"":`<div class="row" style="flex:0 0 auto;flex-wrap:nowrap"><button onclick="db.collection('users').doc('${u.id}').update({ativo:${u.ativo===false}})">${u.ativo===false?"Ativar":"Desativar"}</button><button class="bad" onclick="removerUser('${u.id}')">Remover</button></div>`}</div>`).join("")}</div>`}

 if(!nome||!/^[a-z0-9._-]{3,}$/.test(us)||pw.length<6)return toast("Preencha nome, usuário (a-z, 0-9) e senha (6+)");

const renMesa=renomearMesa;
function vProdAdm(){return `<div class="card"><h3>Novo produto</h3><div class="row"><input id="pn" placeholder="Nome"><input id="pv" placeholder="Preço" inputmode="decimal"><input id="pc" placeholder="Categoria" list="cl"><datalist id="cl">${[...new Set(S.prods.map(p=>p.cat))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div><label><input type="checkbox" id="pp" checked style="width:auto;min-height:0"> Precisa de preparo (vai para a cozinha)</label><div class="row" style="margin-top:10px"><button class="pri" onclick="addP()">Adicionar</button>${S.prods.length?"":'<button onclick="seed()">Carregar cardápio padrão</button>'}</div></div>${pubCard()}${barraProd()}${listaProd()}${selBar()}`}

const fmtP=n=>Number(n).toFixed(2).replace(".",",");

 catch(e){toast("Erro ao remover: "+(e.code||e.message))}}

 db.collection("produtos").doc(id).update({preco:n}).then(()=>toast("Preço salvo")).catch(e=>toast("Erro: "+e.code))}

function editP(id){const p=S.prods.find(x=>x.id===id);if(!p)return;let img=null,rm=false;
 const cats=[...new Set(S.prods.map(x=>x.cat))],chk='style="width:auto;min-height:0"';
 modal(`<h3>Editar produto</h3><label>Nome</label><input id="ep_n" maxlength="60" value="${esc(p.nome)}"><label>Preço</label><input id="ep_v" inputmode="decimal" value="${fmtP(p.preco)}"><label>Categoria</label><input id="ep_c" list="ep_l" value="${esc(p.cat)}"><datalist id="ep_l">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist><label><input type="checkbox" id="ep_p" ${p.prep?"checked":""} ${chk}> Precisa de preparo (vai pra cozinha)</label><label><input type="checkbox" id="ep_a" ${p.ativo===false?"":"checked"} ${chk}> Disponível (aparece no cardápio e pro garçom)</label><label>Foto (opcional)</label><div class="row" style="align-items:center;flex-wrap:nowrap"><img id="ep_i" class="ph" alt="" style="display:none"><input id="ep_f" type="file" accept="image/*"></div><button id="ep_r" style="margin-top:8px;display:none">Remover foto</button><div class="row" style="margin-top:12px"><button class="pri" id="ep_ok">Salvar</button><button onclick="fecharCmd()">Cancelar</button></div><button class="bad" id="ep_d" style="width:100%;margin-top:10px">🗑️ Remover produto</button>`,()=>{
  $("#ep_d").onclick=()=>{fecharCmd();remP(id)};
  const show=u=>{$("#ep_i").src=u;$("#ep_i").style.display="block";$("#ep_r").style.display="block"};
  if(p.fv)db.collection("fotos").doc(id).get().then(d=>{if(d.exists&&$("#ep_i")&&!img&&!rm)show(d.data().img)}).catch(()=>{});
  $("#ep_f").onchange=e=>{const f=e.target.files[0];f&&redim(f).then(u=>{img=u;rm=false;show(u)}).catch(()=>toast("Não consegui ler essa imagem"))};
  $("#ep_r").onclick=()=>{img=null;rm=true;$("#ep_i").style.display="none";$("#ep_r").style.display="none";$("#ep_f").value=""};
  $("#ep_ok").onclick=async()=>{const n=$("#ep_n").value.trim(),v=parseFloat($("#ep_v").value.replace(",",".")),c=$("#ep_c").value.trim();
   if(!n||!(v>0)||!c)return toast("Informe nome, preço e categoria");
   const up={nome:n,preco:v,cat:c,prep:$("#ep_p").checked,ativo:$("#ep_a").checked};
   try{if(img){const ts=Date.now();await db.collection("fotos").doc(id).set({img,ts});up.fv=ts}
    else if(rm&&p.fv){await db.collection("fotos").doc(id).delete();up.fv=firebase.firestore.FieldValue.delete()}
    await db.collection("produtos").doc(id).update(up);fecharCmd();toast("Produto salvo")}
   catch(e){toast("Erro: "+(e.code||e.message))}}})}
function seed(){const b=db.batch();SEED.split(";").forEach(c=>{const[h,l]=c.split("|"),[cat,pr]=h.split("*");l.split(",").forEach(x=>{const[n,v]=x.split(":");b.set(db.collection("produtos").doc(),{nome:n,preco:+v,cat,prep:pr==="1",ativo:true})})});b.commit().then(()=>toast("Cardápio carregado"))}

/* ===== CARDÁPIO DOS CLIENTES =====
   O site cardapio.html lê UM único documento (publico/cardapio) em vez de um por produto: gasta bem menos leituras do Firebase.
   Este app (só quando o admin está logado) regrava esse documento sozinho, uns segundos depois de mudar produto, preço, foto, Happy Hour ou nome/cor/logo.
   Só escreve se o conteúdo realmente mudou. */
const CATORD=["Espetinhos","Pão de alho","Pra beliscar","Pastéis","Caldinhos","Dindin gourmet","Cervejas 600ml","Sucos","Cachaças 300ml","Doses"];
const hashS=t=>{let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return h+":"+t.length};
function montarPub(){const c=S.cfg,o=x=>{const i=CATORD.findIndex(y=>y.toLowerCase()===String(x).trim().toLowerCase());return i<0?99:i};
 const itens=S.prods.filter(p=>p.ativo!==false).sort((a,b)=>o(a.cat)-o(b.cat)||String(a.cat).localeCompare(b.cat)||a.preco-b.preco||a.nome.localeCompare(b.nome))
  .map(p=>{const i={id:p.id,n:p.nome,p:p.preco,c:p.cat};if(p.hh&&p.hhPreco>0)i.hp=p.hhPreco;if(p.fv)i.f=p.fv;return i});
 return{nome:c.nome,cor:c.cor,logo:c.logo||"",hhOn:c.hhOn!==false,hhIni:c.hhIni||"17:00",hhFim:c.hhFim||"20:00",itens}}
let pubT=null;
const agendaPub=()=>{clearTimeout(pubT);pubT=setTimeout(()=>publicar(false),4000)};
function publicar(manual){if(!S.u||S.u.role!=="admin")return;
 if(!S.prods.length)return manual&&toast("Cadastre produtos antes de publicar");
 const j=JSON.stringify(montarPub()),h=hashS(j);let ult=null;try{ult=localStorage.getItem("pubH")}catch(e){}
 if(!manual&&h===ult)return;
 db.collection("publico").doc("cardapio").set({json:j,ts:Date.now()})
  .then(()=>{try{localStorage.setItem("pubH",h)}catch(e){}S.pubTs=Date.now();if(manual)toast("Cardápio publicado");render()})
  .catch(e=>{if(manual)toast("Erro: "+e.code)})}
const pubCard=()=>`<div class="card"><h3>🌐 Cardápio dos clientes</h3><p class="m" style="margin:0 0 10px">Atualiza sozinho quando você muda produtos, preços, fotos ou Happy Hour.${S.pubTs?" Última publicação: "+new Date(S.pubTs).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})+".":""}</p><button onclick="publicar(true)">Publicar agora</button></div>`;

/* ===== aba Happy Hour (admin) ===== */
function vHH(){const h=hhInfo(),c=S.cfg,por={},n=S.prods.filter(p=>p.hh).length;
 S.prods.forEach(p=>(por[p.cat]=por[p.cat]||[]).push(p));
 return `<div class="card"><h3>🍻 Happy Hour</h3><p class="m" style="margin:0 0 6px">${h?"Acontecendo agora · termina às "+esc(h.fim):"Fora do horário agora"} · ${n} produto${n===1?"":"s"} no Happy Hour</p>
<label class="hhl" style="color:var(--t);font-size:16px;min-height:48px;margin:6px 0"><input type="checkbox" id="hon" ${c.hhOn===false?"":"checked"} onchange="saveHH()"> Happy Hour ligado</label>
<div class="hht"><div><label>Começa</label><input id="hi" type="time" value="${esc(c.hhIni||"17:00")}" onchange="saveHH()"></div><div><label>Termina</label><input id="hf" type="time" value="${esc(c.hhFim||"20:00")}" onchange="saveHH()"></div></div>
<p class="m" style="margin:10px 0 0;font-size:13px">O horário é salvo automaticamente ao mudar.</p></div>
<div class="card"><p class="m" style="margin:0">Marque os produtos que entram no Happy Hour e coloque o preço promocional. Só durante o horário o preço promocional vale; depois o preço normal volta sozinho, no app e no cardápio dos clientes.</p></div>
${Object.keys(por).sort().map(cat=>`<div class="card"><h3>${esc(cat)}</h3>${por[cat].map(p=>`<div class="ln hr${p.hh?" on3":""}"><label class="hhl" style="flex:1 1 150px;min-width:0;margin:0;min-height:52px;color:var(--t);font-size:16px"><input type="checkbox" ${p.hh?"checked":""} onchange="hhMarcar('${p.id}',this.checked)"><span><b>${esc(p.nome)}</b><br><small class="m">normal ${money(p.preco)}</small>${p.hh&&!(p.hhPreco<p.preco)?'<br><small style="color:#ffb21a">⚠️ defina um preço menor que o normal</small>':""}</span></label>${p.hh?`<div class="hp2"><small class="m">Preço no HH</small><input class="pi" inputmode="decimal" value="${fmtP(p.hhPreco||p.preco)}" onchange="setHHPreco('${p.id}',this.value)" aria-label="Preço no Happy Hour"></div>`:""}</div>`).join("")}</div>`).join("")}`}
function hhMarcar(id,on){const p=S.prods.find(x=>x.id===id);if(!p)return;
 const o={hh:on};if(on&&!(p.hhPreco>0))o.hhPreco=p.preco;
 db.collection("produtos").doc(id).update(o).then(()=>{if(on&&!(p.hhPreco>0))toast("Agora defina o preço do Happy Hour")}).catch(e=>toast("Erro: "+e.code))}
function setHHPreco(id,v){const n=parseFloat(String(v).replace(",","."));if(!(n>0)){toast("Preço inválido");return render()}
 db.collection("produtos").doc(id).update({hhPreco:n}).then(()=>toast("Preço do Happy Hour salvo")).catch(e=>toast("Erro: "+e.code))}
/* salva sozinho ao mexer. Aplica na tela na hora (assim o app não "desfaz" o que você escolheu ao redesenhar) e grava no servidor logo depois */
let hhT=null;
function saveHH(){const o={hhOn:$("#hon").checked,hhIni:$("#hi").value,hhFim:$("#hf").value};
 if(!o.hhIni||!o.hhFim)return;
 if(o.hhIni===o.hhFim)return toast("Início e fim precisam ser horários diferentes");
 const ant={hhOn:S.cfg.hhOn,hhIni:S.cfg.hhIni,hhFim:S.cfg.hhFim};Object.assign(S.cfg,o);
 clearTimeout(hhT);hhT=setTimeout(()=>db.collection("config").doc("app").set({hhOn:S.cfg.hhOn,hhIni:S.cfg.hhIni,hhFim:S.cfg.hhFim},{merge:true})
  .then(()=>toast("Happy Hour salvo")).catch(e=>{Object.assign(S.cfg,ant);render();toast("Erro: "+e.code)}),500)}
const vCfg=()=>`<div class="card"><label>Nome exibido no aplicativo</label><input id="cn" value="${esc(S.cfg.nome)}"><label>Cor principal</label><input id="cc" type="color" value="${esc(S.cfg.cor)}"><label>Logo (imagem quadrada)</label><input id="cl" type="file" accept="image/*"><button class="pri" style="margin-top:14px" onclick="saveCfg()">Salvar</button></div>`;
async function saveCfg(){const o={nome:$("#cn").value.trim()||"Espetinhos",cor:$("#cc").value},f=$("#cl").files[0];
 if(f)o.logo=await new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=c.height=128;const s=Math.min(i.width,i.height);c.getContext("2d").drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,128,128);r(c.toDataURL("image/jpeg",.8))};i.src=URL.createObjectURL(f)});
 db.collection("config").doc("app").set(o,{merge:true}).then(()=>toast("Configurações salvas")).catch(e=>toast("Erro: "+e.code))}
if("serviceWorker"in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
