<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14100d"><meta name="robots" content="noindex,nofollow">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Espetinhos</title>
<style>
:root{--bg:#14100d;--p:#1e1813;--p2:#2a221b;--ln:#3b3027;--acc:#ff6a1a;--g:#35c46e;--r:#e5483f;--t:#f7efe6;--m:#a8998a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#splash{position:fixed;inset:0;z-index:50;display:grid;place-content:center;gap:14px;text-align:center;background:var(--bg)}#splash.off{display:none}
.mark{display:grid;place-items:center;width:64px;height:64px;margin:auto;border-radius:18px;background:linear-gradient(145deg,color-mix(in srgb,var(--acc),#fff 35%),var(--acc));font-size:32px;overflow:hidden}.mark img{width:100%;height:100%;object-fit:cover}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#14100df2;border-bottom:3px solid var(--acc)}header .mark{width:38px;height:38px;font-size:20px;border-radius:12px;margin:0}header b{font-size:18px}.sp{flex:1}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px}nav button{flex:0 0 auto}
main{padding:0 12px 40px;max-width:1000px;margin:auto}
button{font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;min-height:44px;font-weight:700;cursor:pointer}button:active{transform:scale(.97)}
.pri{background:var(--acc);border-color:var(--acc);color:#1b0f06}.ok{background:var(--g);border-color:var(--g);color:#052612}.bad{color:var(--r)}
input,select{font:inherit;color:var(--t);background:#17110d;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc)}label{display:block;margin:10px 0 4px;color:var(--m);font-size:14px}
.card{background:var(--p);border:1px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:12px}h2,h3{margin:0 0 8px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}.chips button{flex:0 0 auto}.on{outline:3px solid var(--t)}.occ{background:#4a2c12;border-color:#ffb21a}.rdy{background:var(--g);color:#052612;border-color:var(--g)}
.ln{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--ln)}.m{color:var(--m);font-size:14px}
.tag{font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--p2);display:inline-block}.novo{color:#ffb21a}.preparo{color:#6ab7ff}.pronto{background:var(--g);color:#052612}
.tot{font-size:26px;font-weight:800;color:var(--acc);margin:8px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}.login .card{width:min(100%,380px);padding:26px;text-align:center}.login form>*{text-align:left}.err{color:#ff7b72;min-height:20px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--t);color:#14100d;padding:12px 18px;border-radius:12px;font-weight:700;transition:.25s;z-index:99;max-width:90%}#toast.show{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="splash"><div class="mark" id="sl">🔥</div><b id="sn">Espetinhos</b><span class="m">A carregar…</span></div>
<div id="app"></div><div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
const CFG={apiKey:"AIzaSyA0JWR3EyD6WnPLkycruhW9k0f6_kL8HK8",authDomain:"espetinho-pedidos-jp.firebaseapp.com",projectId:"espetinho-pedidos-jp",storageBucket:"espetinho-pedidos-jp.firebasestorage.app",messagingSenderId:"825804185421",appId:"1:825804185421:web:f6c901305b62abab232104"};
firebase.initializeApp(CFG);
const auth=firebase.auth(),db=firebase.firestore(),DOM="@espetinhos.app";
db.settings({experimentalForceLongPolling:true});
setTimeout(()=>$("#splash").classList.add("off"),8000);
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),money=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const S={cfg:{nome:"Espetinhos",cor:"#ff6a1a",logo:""},mesas:[],prods:[],peds:[],users:[],tab:"",mesa:null,cat:null,draft:{},u:null,un:[],prev:null};
const TABS={garcom:[["mesas","Mesas"],["meus","Meus pedidos"]],cozinha:[["fila","Fila"]],admin:[["peds","Pedidos"],["equipe","Equipe"],["mesasadm","Mesas"],["prodadm","Produtos"],["cfg","Config"]]};
const LBL={novo:"Enviado",preparo:"Em preparo",pronto:"Pronto",entregue:"Entregue"};
const SEED="Espetinhos*1|Calabresa:6,Frango:6,Porco:6,Salsichão:6,Asinha de frango:9,Alcatra:10,Carne de sol:10,Carne de sol com queijo:10,Charque:10,Coração:10,Cupim:10,Frango com bacon:10,Kafta:10,Linguiça calabresa:8,Linguiça toscana:8,Medalhão de frango:10,Medalhão recheado:10,Queijo coalho:10,Ovo com bacon:9;Pão de alho*1|Bacon:9,Camarão:10,Carne seca com cream cheese:15,Calabresa:9,Tradicional:8;Pra beliscar*1|Batata frita P:10,Batata frita G:15,Camarão empanado 300gr:40,Camarão alho e óleo 300ml:35,Carne de sol com fritas:40,Calabresa com fritas:25,Ensopado de camarão 300ml:25,Ensopado de marisco 300ml:25,Fava porção 300gr:20,Isca de frango:25,Mocotó porção 300ml:20,Purê de macaxeira 300gr:20,Tripá bovina:20,Pra beliscar completo:55;Pastéis*1|Carne seca com cream cheese:25,Frango:20,Frango com cream cheese:25,Queijo:20;Caldinhos*1|Caldinho de camarão:10,Caldinho de charque:10,Caldinho de fava:8,Caldinho de mocotó:10;Dindin gourmet*1|Surpresa de morango:6,Mousse de maracujá:6,Oreo:6,Pudim:6,Ninho com morango:6;Cervejas 600ml*0|Itaipava:8,Skol Pilsen:9,Amstel:10,Brahma Chopp:10;Sucos*0|Jarra acerola:20,Caju:10,Cajá:10,Graviola:10,Manga:10,Maracujá:12,Jarra maracujá:24;Cachaças 300ml*0|Matuta cristal:20,Matuta sabor:22,Serra da Areia cristal:20,Serra da Areia sabor:22;Doses*0|Dreher:5,Red Label:10,Montila:5,Matuta cristal:4,Matuta sabor:5,Serra da Areia cristal:4,Serra da Areia sabor:5";
let tt,ac;
const toast=m=>{const t=$("#toast");t.textContent=m;t.className="show";clearTimeout(tt);tt=setTimeout(()=>t.className="",3000)};
const beep=()=>{try{ac=ac||new AudioContext();const o=ac.createOscillator();o.connect(ac.destination);o.frequency.value=880;o.start();o.stop(ac.currentTime+.3);navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}};
const logo=()=>S.cfg.logo?`<img src="${S.cfg.logo}" alt="">`:"🔥",ago=p=>Math.floor((Date.now()-p.ts)/60000),tot=ps=>ps.reduce((s,p)=>s+p.itens.reduce((a,i)=>a+i.preco*i.qty,0),0);
function theme(){document.documentElement.style.setProperty("--acc",S.cfg.cor);document.title=S.cfg.nome;$("#sl").innerHTML=logo();$("#sn").textContent=S.cfg.nome}

auth.onAuthStateChanged(async f=>{S.un.forEach(u=>u());S.un=[];S.prev=null;
 if(!f){S.u=null;$("#splash").classList.add("off");return render()}
 try{const d=await db.collection("users").doc(f.uid).get();if(!d.exists||d.data().ativo===false)throw 0;
  S.u={uid:f.uid,...d.data()};S.tab=TABS[S.u.role][0][0];start()}
 catch(e){await auth.signOut();toast(e&&e.code&&e.code!=="permission-denied"?"Sem conexão com o servidor ("+e.code+")":"Acesso não autorizado: utilizador sem cadastro ou inativo.")}
 $("#splash").classList.add("off")});
function start(){const sub=(q,fn)=>S.un.push(q.onSnapshot(fn,e=>console.error(e.code))),list=s=>s.docs.map(d=>({id:d.id,...d.data()}));
 sub(db.collection("config").doc("app"),d=>{if(d.exists)Object.assign(S.cfg,d.data());theme();render()});
 sub(db.collection("mesas"),s=>{S.mesas=list(s).sort((a,b)=>a.ord-b.ord);render()});
 sub(db.collection("produtos"),s=>{S.prods=list(s).sort((a,b)=>a.nome.localeCompare(b.nome));render()});
 sub(db.collection("pedidos").where("aberto","==",true),s=>{const n=list(s).sort((a,b)=>a.ts-b.ts);
  if(S.prev)n.forEach(p=>{const o=S.prev[p.id];
   if(S.u.role==="garcom"&&p.garcomUid===S.u.uid&&p.status==="pronto"&&o!=="pronto"){toast("✅ "+p.mesaNome+": pedido pronto!");beep()}
   if(S.u.role==="cozinha"&&o===undefined&&p.status==="novo"){toast("🔔 Novo pedido: "+p.mesaNome);beep()}});
  S.prev=Object.fromEntries(n.map(p=>[p.id,p.status]));S.peds=n;render()});
 if(S.u.role==="admin")sub(db.collection("users"),s=>{S.users=list(s);render()})}

function login(){return `<div class="login"><div class="card"><div class="mark">${logo()}</div><h2 style="margin-top:14px">${esc(S.cfg.nome)}</h2><p class="m">Acesso restrito à equipe</p><form onsubmit="return entrar(event)"><label>Utilizador</label><input id="lu" autocapitalize="none" autocomplete="username" required><label>Senha</label><input id="lp" type="password" autocomplete="current-password" required><button class="pri" style="width:100%;margin-top:16px">Entrar</button><div class="err" id="le"></div></form></div></div>`}
function entrar(e){e.preventDefault();auth.signInWithEmailAndPassword($("#lu").value.trim().toLowerCase()+DOM,$("#lp").value).catch(()=>$("#le").textContent="Utilizador ou senha incorretos.");return false}
const typing=()=>{const e=document.activeElement;return e&&e.closest&&e.closest("#app")&&/INPUT|TEXTAREA|SELECT/.test(e.tagName)};
function render(){if(typing())return;const a=$("#app");if(!S.u){if(!a.querySelector(".login"))a.innerHTML=login();return}
 a.innerHTML=`<header><span class="mark">${logo()}</span><b>${esc(S.cfg.nome)}</b><span class="sp"></span><button onclick="senha()" aria-label="Alterar minha senha">🔑</button><button onclick="auth.signOut()">${esc(S.u.nome)} · Sair</button></header><nav>${TABS[S.u.role].map(([k,n])=>`<button class="${S.tab===k?"pri":""}" onclick="S.tab='${k}';render()">${n}</button>`).join("")}</nav><main>${({mesas:vMesas,meus:vMeus,fila:vFila,peds:vPeds,equipe:vEquipe,mesasadm:vMesasAdm,prodadm:vProdAdm,cfg:vCfg}[S.tab]||(()=>""))()}</main>`}
addEventListener("focusout",()=>setTimeout(render,250));setInterval(render,30000);
function senha(){const p=prompt("Nova senha (mínimo 6 caracteres):");if(p)auth.currentUser.updatePassword(p).then(()=>toast("Senha alterada")).catch(e=>toast(e.code==="auth/requires-recent-login"?"Saia e entre de novo para trocar a senha":"Erro: "+e.code))}

const cardPed=(p,act)=>`<div class="ln" style="align-items:flex-start"><div style="flex:1"><b>${esc(p.mesaNome)}</b> <span class="m">· ${esc(p.garcomNome)} · ${ago(p)} min</span>${p.itens.map(i=>`<div>${i.qty}× ${esc(i.nome)}${i.obs?` <small class="m">(${esc(i.obs)})</small>`:""}</div>`).join("")}</div><div><span class="tag ${p.status}">${LBL[p.status]}</span>${act&&p.status==="pronto"?`<br><button class="ok" onclick="setSt('${p.id}','entregue')">Entregar</button>`:""}</div></div>`;
function vMesas(){const ms=S.mesas.filter(m=>m.ativa!==false);
 const chips=`<div class="chips">${ms.map(m=>{const l=S.peds.filter(p=>p.mesaId===m.id);return `<button class="${S.mesa===m.id?"on":""} ${l.some(p=>p.status==="pronto")?"rdy":l.length?"occ":""}" onclick="S.mesa='${m.id}';render()">${esc(m.nome)}</button>`}).join("")||'<span class="m">Nenhuma mesa cadastrada. Peça ao administrador.</span>'}</div>`;
 if(!ms.some(m=>m.id===S.mesa))return chips;
 const pr=S.prods.filter(p=>p.ativo!==false),cats=[...new Set(pr.map(p=>p.cat))],cat=cats.includes(S.cat)?S.cat:cats[0],d=S.draft[S.mesa]||[],ps=S.peds.filter(p=>p.mesaId===S.mesa);
 return chips+`<div class="card"><div class="chips">${cats.map(c=>`<button class="${c===cat?"pri":""}" onclick="S.cat=this.dataset.c;render()" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div><div class="g">${pr.filter(p=>p.cat===cat).map(p=>`<button onclick="add('${p.id}')">${esc(p.nome)}<br><small class="m">${money(p.preco)}</small></button>`).join("")}</div></div>
<div class="card"><h3>Novo pedido</h3>${d.map((i,k)=>`<div class="ln"><div style="flex:1"><b>${esc(i.nome)}</b><input placeholder="Observação (ex.: sem cebola)" value="${esc(i.obs)}" oninput="S.draft[S.mesa][${k}].obs=this.value"></div><div class="row" style="flex:0 0 auto;flex-wrap:nowrap"><button onclick="qty(${k},-1)">−</button><b>${i.qty}</b><button onclick="qty(${k},1)">+</button></div></div>`).join("")||'<p class="m">Toque nos produtos para montar o pedido.</p>'}${d.length?'<button class="pri" style="width:100%;margin-top:10px" onclick="enviar()">Enviar pedido</button>':""}</div>
<div class="card"><h3>Conta</h3>${ps.map(p=>cardPed(p,1)).join("")||'<p class="m">Mesa livre.</p>'}<div class="tot">${money(tot(ps))}</div>${ps.length?'<button class="ok" onclick="fechar()">Fechar conta</button>':""}</div>`}
const vMeus=()=>`<div class="card">${S.peds.filter(p=>p.garcomUid===S.u.uid).map(p=>cardPed(p,1)).join("")||'<p class="m">Nenhum pedido em aberto.</p>'}</div>`;
const vPeds=()=>`<div class="card">${S.peds.map(p=>cardPed(p,0)).join("")||'<p class="m">Nenhum pedido em aberto.</p>'}</div>`;
function vFila(){const l=S.peds.filter(p=>["novo","preparo"].includes(p.status)&&p.itens.some(i=>i.prep));
 return `<div class="g2">${l.map(p=>`<div class="card"><h2>${esc(p.mesaNome)} <small class="m">${ago(p)} min · ${LBL[p.status]}</small></h2><div class="m">Garçom: ${esc(p.garcomNome)}</div>${p.itens.filter(i=>i.prep).map(i=>`<div class="ln"><b>${i.qty}× ${esc(i.nome)}</b>${i.obs?`<span class="tag">${esc(i.obs)}</span>`:""}</div>`).join("")}<div class="row" style="margin-top:10px">${p.status==="novo"?`<button onclick="setSt('${p.id}','preparo')">Em preparo</button>`:""}<button class="ok" onclick="setSt('${p.id}','pronto')">Pronto</button></div></div>`).join("")||'<p class="m">Fila limpa 🎉</p>'}</div>`}
const setSt=(id,s)=>db.collection("pedidos").doc(id).update({status:s}).catch(e=>toast("Sem permissão: "+e.code));
function add(id){const p=S.prods.find(x=>x.id===id),d=S.draft[S.mesa]=S.draft[S.mesa]||[],x=d.find(i=>i.pid===id&&!i.obs);x?x.qty++:d.push({pid:id,nome:p.nome,preco:p.preco,prep:!!p.prep,qty:1,obs:""});render()}
function qty(k,n){const d=S.draft[S.mesa];d[k].qty+=n;if(d[k].qty<1)d.splice(k,1);render()}
function enviar(){const d=S.draft[S.mesa]||[],m=S.mesas.find(x=>x.id===S.mesa);if(!d.length)return;
 db.collection("pedidos").add({mesaId:m.id,mesaNome:m.nome,garcomUid:S.u.uid,garcomNome:S.u.nome,itens:d.map(({nome,preco,qty,obs,prep})=>({nome,preco,qty,obs:obs||"",prep})),status:d.some(i=>i.prep)?"novo":"entregue",aberto:true,ts:Date.now()})
 .then(()=>{delete S.draft[S.mesa];toast("Pedido enviado");render()}).catch(e=>toast("Erro ao enviar: "+e.code))}
function fechar(){if(!confirm("Fechar a conta desta mesa?"))return;const b=db.batch();S.peds.filter(p=>p.mesaId===S.mesa).forEach(p=>b.update(db.collection("pedidos").doc(p.id),{aberto:false,fechadoEm:Date.now()}));b.commit().then(()=>toast("Conta fechada")).catch(e=>toast("Erro: "+e.code))}

function vEquipe(){return `<div class="card"><h3>Novo funcionário</h3><div class="row"><input id="en" placeholder="Nome"><input id="eu" placeholder="Utilizador (a-z, 0-9)" autocapitalize="none"><input id="ep" placeholder="Senha (mín. 6)"><select id="er"><option value="garcom">Garçom</option><option value="cozinha">Cozinha</option><option value="admin">Administrador</option></select></div><button class="pri" style="margin-top:10px" onclick="criar()">Criar conta</button></div><div class="card">${S.users.map(u=>`<div class="ln"><div><b>${esc(u.nome)}</b> <span class="m">${esc(u.usuario)} · ${u.role}${u.ativo===false?" · inativo":""}</span></div>${u.id===S.u.uid?"":`<div class="row" style="flex:0 0 auto;flex-wrap:nowrap"><button onclick="db.collection('users').doc('${u.id}').update({ativo:${u.ativo===false}})">${u.ativo===false?"Ativar":"Desativar"}</button><button class="bad" onclick="confirm('Remover ${esc(u.nome)}?')&&db.collection('users').doc('${u.id}').delete()">Remover</button></div>`}</div>`).join("")}</div>`}
async function criar(){const nome=$("#en").value.trim(),us=$("#eu").value.trim().toLowerCase(),pw=$("#ep").value,role=$("#er").value;
 if(!nome||!/^[a-z0-9._-]{3,}$/.test(us)||pw.length<6)return toast("Preencha nome, utilizador (a-z, 0-9) e senha (6+)");
 const sec=firebase.apps.find(a=>a.name==="sec")||firebase.initializeApp(CFG,"sec");
 try{const c=await sec.auth().createUserWithEmailAndPassword(us+DOM,pw);await db.collection("users").doc(c.user.uid).set({nome,usuario:us,role,ativo:true});await sec.auth().signOut();toast("Conta criada: "+us);["#en","#eu","#ep"].forEach(i=>$(i).value="")}
 catch(e){toast(e.code==="auth/email-already-in-use"?"Esse utilizador já existe":"Erro: "+e.code)}}
function vMesasAdm(){return `<div class="card"><div class="row"><input id="mn" placeholder="Nome (ex.: Mesa 13)"><button class="pri" onclick="addMesa()">Adicionar mesa</button>${S.mesas.length?"":'<button onclick="seedMesas()">Criar Mesas 1–12</button>'}</div></div><div class="card">${S.mesas.map(m=>`<div class="ln"><div><b>${esc(m.nome)}</b>${m.ativa===false?' <span class="m">· inativa</span>':""}</div><div class="row" style="flex:0 0 auto;flex-wrap:nowrap"><button onclick="renMesa('${m.id}')">Editar</button><button onclick="db.collection('mesas').doc('${m.id}').update({ativa:${m.ativa===false}})">${m.ativa===false?"Ativar":"Desativar"}</button></div></div>`).join("")}</div>`}
const addMesa=()=>{const n=$("#mn").value.trim();n&&db.collection("mesas").add({nome:n,ord:Date.now(),ativa:true})};
const seedMesas=()=>{const b=db.batch();for(let i=1;i<=12;i++)b.set(db.collection("mesas").doc(),{nome:"Mesa "+i,ord:i,ativa:true});b.commit()};
const renMesa=id=>{const n=prompt("Novo nome da mesa:");n&&db.collection("mesas").doc(id).update({nome:n.trim()})};
function vProdAdm(){return `<div class="card"><h3>Novo produto</h3><div class="row"><input id="pn" placeholder="Nome"><input id="pv" placeholder="Preço" inputmode="decimal"><input id="pc" placeholder="Categoria" list="cl"><datalist id="cl">${[...new Set(S.prods.map(p=>p.cat))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div><label><input type="checkbox" id="pp" checked style="width:auto;min-height:0"> Precisa de preparo (vai para a cozinha)</label><div class="row" style="margin-top:10px"><button class="pri" onclick="addP()">Adicionar</button>${S.prods.length?"":'<button onclick="seed()">Carregar cardápio padrão</button>'}</div></div><div class="card">${S.prods.map(p=>`<div class="ln"><div><b>${esc(p.nome)}</b> <span class="m">${money(p.preco)} · ${esc(p.cat)}${p.prep?"":" · sem preparo"}${p.ativo===false?" · inativo":""}</span></div><div class="row" style="flex:0 0 auto;flex-wrap:nowrap"><button onclick="editP('${p.id}')">Editar</button><button onclick="db.collection('produtos').doc('${p.id}').update({ativo:${p.ativo===false}})">${p.ativo===false?"Ativar":"Desativar"}</button></div></div>`).join("")}</div>`}
function addP(){const nome=$("#pn").value.trim(),preco=parseFloat($("#pv").value.replace(",",".")),cat=$("#pc").value.trim();if(!nome||!(preco>0)||!cat)return toast("Preencha nome, preço e categoria");db.collection("produtos").add({nome,preco,cat,prep:$("#pp").checked,ativo:true}).then(()=>["#pn","#pv"].forEach(i=>$(i).value=""))}
function editP(id){const p=S.prods.find(x=>x.id===id),n=prompt("Nome:",p.nome);if(!n)return;const v=parseFloat(String(prompt("Preço:",p.preco)).replace(",","."));if(v>0)db.collection("produtos").doc(id).update({nome:n.trim(),preco:v})}
function seed(){const b=db.batch();SEED.split(";").forEach(c=>{const[h,l]=c.split("|"),[cat,pr]=h.split("*");l.split(",").forEach(x=>{const[n,v]=x.split(":");b.set(db.collection("produtos").doc(),{nome:n,preco:+v,cat,prep:pr==="1",ativo:true})})});b.commit().then(()=>toast("Cardápio carregado"))}
const vCfg=()=>`<div class="card"><label>Nome exibido no aplicativo</label><input id="cn" value="${esc(S.cfg.nome)}"><label>Cor principal</label><input id="cc" type="color" value="${esc(S.cfg.cor)}"><label>Logo (imagem quadrada)</label><input id="cl" type="file" accept="image/*"><button class="pri" style="margin-top:14px" onclick="saveCfg()">Salvar</button></div>`;
async function saveCfg(){const o={nome:$("#cn").value.trim()||"Espetinhos",cor:$("#cc").value},f=$("#cl").files[0];
 if(f)o.logo=await new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=c.height=128;const s=Math.min(i.width,i.height);c.getContext("2d").drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,128,128);r(c.toDataURL("image/jpeg",.8))};i.src=URL.createObjectURL(f)});
 db.collection("config").doc("app").set(o,{merge:true}).then(()=>toast("Configurações salvas")).catch(e=>toast("Erro: "+e.code))}
if("serviceWorker"in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
